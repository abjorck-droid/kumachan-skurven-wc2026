name: scoreboard-poll

# Live fixtures + scores + events → Airtable, every 15 minutes.
# Keys come from repo secrets (Settings → Secrets and variables → Actions):
#   API_FOOTBALL_KEY, AIRTABLE_PAT, AIRTABLE_BASE_ID
# The script self-skips outside the tournament window, so 24/7 cron is safe.
# Tip: use a PUBLIC repo (code only — picks live in Airtable) for unlimited Action minutes,
# or disable this workflow outside June 11 – July 19.

on:
  schedule:
    - cron: "*/15 * * * *"      # every 15 min (UTC)
  workflow_dispatch: {}          # manual "Run workflow" button

concurrency:
  group: scoreboard-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    # 8 min: above the real worst-case run (~6 min during busy live matches),
    # but well under GitHub's ~15-min runner-acquisition limbo. If a hosted
    # runner is never acquired, the job fails fast instead of dragging to 15 min
    # and overlapping the next scheduled poll.
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Run scoreboard poller
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          AIRTABLE_PAT: ${{ secrets.AIRTABLE_PAT }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
        run: python scripts/poller.py --mode scoreboard
      - name: Resolve side games
        env:
          AIRTABLE_PAT: ${{ secrets.AIRTABLE_PAT }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
        run: python scripts/resolve_sidegames.py
      - name: Recompute scores
        env:
          AIRTABLE_PAT: ${{ secrets.AIRTABLE_PAT }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
        run: python scripts/scoring_engine.py
