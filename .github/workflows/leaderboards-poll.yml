name: leaderboards-poll

# Group standings → Airtable, once per day (04:10 UTC).
# Same repo secrets as scoreboard-poll: API_FOOTBALL_KEY, AIRTABLE_PAT, AIRTABLE_BASE_ID.
# Self-skips outside the tournament window.

on:
  schedule:
    - cron: "10 4 * * *"        # daily at 04:10 UTC
  workflow_dispatch: {}

concurrency:
  group: leaderboards-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    # 5 min is plenty for the single daily poller step, and stays well under
    # GitHub's ~15-min runner-acquisition limbo so a dropped runner fails fast.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Run leaderboards poller
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          AIRTABLE_PAT: ${{ secrets.AIRTABLE_PAT }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
        run: python scripts/poller.py --mode leaderboards
