<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World Cup 2026 — Pick Entry</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Antonio:wght@300;400;500;600;700&family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0b10; --card:#14161d; --card-soft:#1a1d26; --border:rgba(255,255,255,0.08);
    --border-strong:rgba(255,255,255,0.16); --text:#f0f0f3; --text-dim:#8a8c94; --text-mute:#5a5c64;
    --accent:#ff1c5c; --gold:#e8b948; --gold-soft:rgba(232,185,72,0.14);
    --andreas:#4ec9b0; --andreas-soft:rgba(78,201,176,0.14); --cal:#c586c0; --cal-soft:rgba(197,134,192,0.16);
    --good:#5ade8c; --bad:#ff5a5a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:'Inter',-apple-system,sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:80px}
  .wrap{max-width:760px;margin:0 auto;padding:0 18px}

  /* sticky header */
  .topbar{position:sticky;top:0;z-index:20;background:rgba(10,11,16,0.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
  .topbar-in{max-width:760px;margin:0 auto;padding:14px 18px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .brand{font-family:'Antonio',sans-serif;font-weight:600;font-size:22px;letter-spacing:.02em}
  .brand .yr{color:var(--accent);font-weight:700}
  .seg{display:flex;border:1px solid var(--border-strong);border-radius:6px;overflow:hidden}
  .seg button{background:transparent;border:none;cursor:pointer;font-family:'Antonio',sans-serif;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-dim);padding:7px 14px;font-weight:500}
  .seg button+button{border-left:1px solid var(--border)}
  .seg button.on{background:var(--andreas-soft);color:var(--andreas)}
  .seg button.cal.on{background:var(--cal-soft);color:var(--cal)}
  .reserves{display:flex;gap:10px;margin-left:auto;align-items:center}
  .chip{font-family:'Antonio',sans-serif;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);background:var(--gold-soft);border:1px solid rgba(232,185,72,.3);border-radius:5px;padding:5px 9px;font-weight:600}
  .chip.empty{color:var(--text-mute);background:transparent;border-color:var(--border)}
  .btn{font-family:'Antonio',sans-serif;font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;border:none;border-radius:6px;padding:9px 16px;cursor:pointer}
  .btn.save{background:var(--accent);color:#fff}
  .btn.save:disabled{opacity:.5;cursor:default}
  .status{font-size:12px;color:var(--text-dim);min-height:16px;font-family:'Antonio',sans-serif;letter-spacing:.06em}

  /* sections */
  h2{font-family:'Antonio',sans-serif;font-weight:600;font-size:20px;letter-spacing:.04em;margin:34px 0 4px;text-transform:uppercase}
  h2 .pts{font-size:12px;color:var(--text-mute);letter-spacing:.08em;margin-left:8px}
  .sub{color:var(--text-dim);font-size:13px;margin-bottom:14px;line-height:1.5}
  .grp-label{font-family:'Antonio',sans-serif;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin:20px 0 8px;font-weight:500}

  .row{display:grid;grid-template-columns:120px 1fr 122px;gap:10px;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:6px;padding:10px 12px;margin-bottom:8px}
  .row.tokened{border-color:rgba(232,185,72,.4)}
  .row.mrow{grid-template-columns:170px 1fr 110px}
  .mctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .mctl select{width:auto;min-width:118px}
  .scorebox{display:inline-flex;align-items:center;gap:5px}
  .scorebox input{width:46px;text-align:center;padding:6px 4px}
  .scorebox b{color:var(--text-mute);font-weight:600}

  /* tab bar (second row of the sticky header) */
  .tabs{max-width:760px;margin:0 auto;padding:0 18px;display:flex;gap:2px;border-top:1px solid var(--border);overflow-x:auto}
  .tabs button{background:transparent;border:none;border-bottom:2px solid transparent;cursor:pointer;font-family:'Antonio',sans-serif;font-size:13px;letter-spacing:.07em;text-transform:uppercase;color:var(--text-dim);padding:11px 13px;font-weight:500;white-space:nowrap}
  .tabs button:hover{color:var(--text)}
  .tabs button.on{color:var(--text);border-bottom-color:var(--accent)}
  .tabs .tc{color:var(--gold);font-size:11px}
  .tabpanel{display:none}
  .tabpanel.active{display:block}
  .row .lab{font-family:'Antonio',sans-serif;font-size:13px;letter-spacing:.05em;color:var(--text-dim);text-transform:uppercase}
  .row .note{grid-column:2 / 4;margin-top:2px}
  select,input{width:100%;background:var(--card-soft);border:1px solid var(--border-strong);border-radius:5px;color:var(--text);font-family:'Inter',sans-serif;font-size:14px;padding:8px 10px;outline:none}
  select:focus,input:focus{border-color:var(--andreas)}
  input.note-in{font-size:13px;color:var(--text-dim);border-style:dashed}
  select[data-role=token]{font-family:'Antonio',sans-serif;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
  .row.tokened select[data-role=token]{color:var(--gold);border-color:rgba(232,185,72,.5)}

  .lockbar{margin:36px 0 10px;padding:18px;border:1px solid var(--border-strong);border-radius:8px;background:var(--card)}
  .lockbar .summary{display:flex;gap:22px;flex-wrap:wrap;font-family:'Antonio',sans-serif;font-size:13px;letter-spacing:.06em;color:var(--text-dim);text-transform:uppercase;margin-bottom:14px}
  .lockbar .summary b{color:var(--text);font-size:18px;font-family:'Cormorant Garamond',serif}
  .btn.lock{background:var(--gold);color:#1a1500}
  .banner{display:none;padding:12px 16px;border-radius:6px;margin:16px 0;font-family:'Antonio',sans-serif;letter-spacing:.06em;text-transform:uppercase;font-size:13px}
  .banner.locked{display:block;background:var(--gold-soft);color:var(--gold);border:1px solid rgba(232,185,72,.4)}
  .banner.err{display:block;background:rgba(255,90,90,.12);color:var(--bad);border:1px solid rgba(255,90,90,.4)}
  .hint{font-size:12px;color:var(--text-mute);margin-top:6px}
  .loading{padding:60px 0;text-align:center;color:var(--text-dim);font-family:'Antonio',sans-serif;letter-spacing:.1em;text-transform:uppercase}
</style>
</head>
<body>
<div class="topbar"><div class="topbar-in">
  <div class="brand">World Cup <span class="yr">26</span> · Picks</div>
  <div class="seg" id="playerSeg">
    <button data-player="Andreas" class="on">Andreas</button>
    <button data-player="Cal" class="cal">Cal</button>
  </div>
  <span class="chip" id="whoami" style="display:none"></span>
  <div class="reserves" id="reserves"></div>
  <button class="btn save" id="saveBtn">Save</button>
  <span class="status" id="status"></span>
</div>
<div class="tabs" id="tabs" style="display:none">
  <button data-tab="matches" class="on">Group matches<span class="tc" id="tc-matches"></span></button>
  <button data-tab="ko">Knockouts<span class="tc" id="tc-ko"></span></button>
  <button data-tab="side">Side bets<span class="tc" id="tc-side"></span></button>
  <button data-tab="review">Review &amp; Lock</button>
</div></div>

<div class="wrap">
  <div id="lockBanner" class="banner locked">🔒 This bracket is locked — view only.</div>
  <div id="errBanner" class="banner err"></div>
  <div id="app"><div class="loading">Loading picks…</div></div>
</div>

<script>
const TOKEN_OPTS = [["","— no token —"],["Double","Double ×2"],["Triple","Triple ×3"],["AllIn","All-In ×5"]];
const START = {Double:4, Triple:2, AllIn:1};

const BRACKET = [
  {title:"Champion", pts:"100 pts", slots:[["Champion","Champion"]]},
  {title:"Finalists", pts:"40 pts each", slots:[["F-1","Finalist 1"],["F-2","Finalist 2"]]},
  {title:"Semi-finalists", pts:"20 pts each", slots:[1,2,3,4].map(i=>["SF-"+i,"Semi-finalist "+i])},
  {title:"Quarter-finalists", pts:"10 pts each", slots:[1,2,3,4,5,6,7,8].map(i=>["QF-"+i,"Quarter-finalist "+i])},
  {title:"Round of 16", pts:"5 pts each", slots:Array.from({length:16},(_,i)=>["R16-"+(i+1),"R16 team "+(i+1)])},
];
// name, points, player-filter ("all" | "gk"), free-text placeholder fallback
const SIDE_PLAYER = [
  ["Golden Boot",60,"all","Player name"],["Golden Glove",60,"gk","Goalkeeper name"],
  ["First Red Card",30,"all","Player name"],["First Own Goal",40,"all","Player name"],
];
const GROUPS = "ABCDEFGHIJKL".split("");

let DATA = null, META = {}, VALUES = {}, PLAYER = "Andreas", LOCKED = false, ACTIVE_TAB = "matches";
// Hosted mode: a magic-link token in the URL (?p=…) means the player is fixed by their link.
// No token = local-server mode with the Andreas/Cal toggle. Same page serves both.
const TOKEN = new URLSearchParams(location.search).get("p");
function api(path){ return TOKEN ? path + (path.includes("?")?"&":"?") + "p=" + encodeURIComponent(TOKEN) : path; }

const $ = s => document.querySelector(s);
function teamOptions(sel){
  let h = '<option value="">— select team —</option>';
  let g = null;
  DATA.teams.forEach(t=>{
    if(t.group !== g){ if(g!==null) h+='</optgroup>'; g=t.group; h+=`<optgroup label="Group ${g||'?'}">`; }
    h += `<option value="${t.id}" ${String(t.id)===String(sel)?'selected':''}>${t.code?t.code+' · ':''}${t.name}</option>`;
  });
  return h + '</optgroup>';
}
function tokenSelect(key){
  const v = (VALUES[key]||{}).token || "";
  return `<select data-key="${key}" data-role="token">` +
    TOKEN_OPTS.map(([val,lab])=>`<option value="${val}" ${val===v?'selected':''}>${lab}</option>`).join('') + `</select>`;
}
function noteInput(key){
  const v = (VALUES[key]||{}).note || "";
  return `<input class="note-in" data-key="${key}" data-role="note" placeholder="Pundit note (optional, hidden until it resolves)" value="${v.replace(/"/g,'&quot;')}">`;
}
function row(key, label, controlHTML){
  const tokened = (VALUES[key]||{}).token ? ' tokened' : '';
  return `<div class="row${tokened}" id="row-${key}">
    <span class="lab">${label}</span>
    ${controlHTML}
    ${tokenSelect(key)}
    ${noteInput(key)}
  </div>`;
}
function teamRow(key,label){ const v=(VALUES[key]||{}).team_id;
  return row(key,label,`<select data-key="${key}" data-role="team">${teamOptions(v)}</select>`); }
function textRow(key,label,ph){ const v=(VALUES[key]||{}).player_text||"";
  return row(key,label,`<input data-key="${key}" data-role="text" placeholder="${ph}" value="${v.replace(/"/g,'&quot;')}">`); }
function hasFootballers(){ return !!(DATA && DATA.footballers && DATA.footballers.length); }
function playerOptions(sel, filter){
  let list = DATA.footballers;
  if(filter==="gk") list = list.filter(p=>p.position==="G");
  else if(filter && filter.length===1) list = list.filter(p=>p.group===filter);  // group letter
  let h='<option value="">— select player —</option>', grp=null;
  list.forEach(p=>{
    const label = p.team_code || (p.group?('Group '+p.group):'?');
    if(label!==grp){ if(grp!==null) h+='</optgroup>'; grp=label; h+=`<optgroup label="${label}">`; }
    const tag=[p.position,(p.shirt_number!=null?'#'+p.shirt_number:null)].filter(Boolean).join(' ');
    h+=`<option value="${p.player_id}" ${String(p.player_id)===String(sel)?'selected':''}>${p.name}${tag?(' · '+tag):''}</option>`;
  });
  return h + (grp!==null?'</optgroup>':'');
}
function playerRow(key,label,filter,ph){
  if(hasFootballers()){ const v=(VALUES[key]||{}).player_id;
    return row(key,label,`<select data-key="${key}" data-role="player">${playerOptions(v,filter)}</select>`); }
  return textRow(key,label,ph);   // graceful fallback before the squad import runs
}
function matchRow(m){
  const key="match|"+m.fixture_id;
  META[key]={type:"match_outcome", match_id:m.fixture_id};
  const v=VALUES[key]||{};
  const hn=m.home_code||m.home_name||"Home", an=m.away_code||m.away_name||"Away";
  const full=(m.home_name||hn)+" v "+(m.away_name||an);
  const oc=v.outcome||"";
  const opt=(val,lab)=>`<option value="${val}" ${oc===val?'selected':''}>${lab}</option>`;
  const sel=`<select data-key="${key}" data-role="outcome"><option value="">— pick —</option>`+
    opt("Home",hn+" win")+opt("Draw","Draw")+opt("Away",an+" win")+`</select>`;
  const sh=(v.score_home==null?"":v.score_home), sa=(v.score_away==null?"":v.score_away);
  const sc=`<span class="scorebox"><input type="number" min="0" data-key="${key}" data-role="score_home" value="${sh}" placeholder="–"><b>:</b><input type="number" min="0" data-key="${key}" data-role="score_away" value="${sa}" placeholder="–"></span>`;
  const tokened=v.token?' tokened':'';
  return `<div class="row mrow${tokened}" id="row-${key}">
    <span class="lab">${full}</span>
    <div class="mctl">${sel}${sc}</div>
    ${tokenSelect(key)}
    ${noteInput(key)}
  </div>`;
}
function numRow(key,label){ const v=(VALUES[key]||{}).scalar; const vv=(v===undefined||v===null)?"":v;
  return row(key,label,`<input type="number" min="0" data-key="${key}" data-role="scalar" placeholder="e.g. 145" value="${vv}">`); }

function render(){
  META = {};
  // --- Knockouts panel: bracket-slot ladder + Dark Horse ---
  let ko = `<h2>Bracket ladder</h2><div class="sub">Name the teams you think reach each knockout round — independent of who they actually play. Stacks with your group-match picks.</div>`;
  BRACKET.forEach(g=>{
    ko += `<div class="grp-label">${g.title} <span style="color:var(--text-mute)">· ${g.pts}</span></div>`;
    g.slots.forEach(([key,label])=>{ META[key]={type:"bracket_slot",bracket_slot:key}; ko += teamRow(key,label); });
  });
  ko += `<h2>Dark Horse <span class="pts">· ladder up to 1000 pts</span></h2><div class="sub">One team, ranked outside the FIFA top 16 at lock. The spiciest pick in the game — an All-In here is the boldest move available.</div>`;
  META["darkhorse"]={type:"dark_horse",side_game:"Dark Horse"};
  ko += teamRow("darkhorse","Dark Horse");

  // --- Group matches panel ---
  let mk = "";
  if(DATA.matches && DATA.matches.length){
    mk += `<h2>Group matches <span class="pts">· 5 pts outcome · +10 exact</span></h2><div class="sub">Call every group match. The scoreline is optional — add it only where you want the +10 exact-score bonus.</div>`;
    let g=null;
    DATA.matches.forEach(m=>{ if(m.group!==g){ g=m.group; mk+=`<div class="grp-label">Group ${g||'?'}</div>`; } mk+=matchRow(m); });
  } else {
    mk += `<h2>Group matches</h2><div class="sub">No fixtures loaded yet — run <code>load_fixtures.py</code>.</div>`;
  }

  // --- Side bets panel ---
  const sgSub = hasFootballers()
    ? "Season-long calls, locked at kickoff. Player picks are real squad dropdowns."
    : "Season-long calls, locked at kickoff. Player names are free text until the squad import runs.";
  let sb = `<h2>Side bets</h2><div class="sub">${sgSub}</div>`;
  SIDE_PLAYER.forEach(([name,pts,filter,ph])=>{ const key="side|"+name; META[key]={type:"side_game",side_game:name};
    sb += playerRow(key, `${name} · ${pts}`, filter, ph); });
  { const key="side|Total Tournament Goals"; META[key]={type:"side_game",side_game:"Total Tournament Goals"};
    sb += numRow(key,"Total Goals · 30"); }
  sb += `<div class="grp-label">Per-group top scorer · 15 pts each</div>`;
  GROUPS.forEach(g=>{ const name="Top Scorer Group "+g, key="side|"+name; META[key]={type:"side_game",side_game:name};
    sb += playerRow(key, "Group "+g, g, "Top scorer"); });

  // --- Review & lock panel ---
  let rv = `<div class="lockbar">
    <h2 style="margin-top:0">Review &amp; lock</h2>
    <div class="summary" id="summary"></div>
    <button class="btn lock" id="lockBtn">Lock my picks</button>
    <div class="hint">Locking stamps every pick immutable and reveals them to your opponent (except pundit notes). You can keep editing &amp; saving across all tabs until you lock.</div>
  </div>`;

  $("#app").innerHTML =
    `<div class="tabpanel" data-tab="matches">${mk}</div>`+
    `<div class="tabpanel" data-tab="ko">${ko}</div>`+
    `<div class="tabpanel" data-tab="side">${sb}</div>`+
    `<div class="tabpanel" data-tab="review">${rv}</div>`;
  $("#tabs").style.display="flex";
  setTab(ACTIVE_TAB);
  updateReserves(); updateSummary();
  if(LOCKED) setLockedUI();
}

function setTab(name){
  ACTIVE_TAB = name;
  document.querySelectorAll(".tabpanel").forEach(p=>p.classList.toggle("active", p.dataset.tab===name));
  document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on", b.dataset.tab===name));
}
function hasVal(v){ return !!(v && (v.team_id||v.player_id||v.player_text||v.outcome||(v.score_home!=null&&v.score_home!=="")||(v.scalar!==undefined&&v.scalar!=="")||v.token||v.note)); }
function tabOf(key){
  if(key.startsWith("match|")) return "matches";
  if(key==="darkhorse"||(META[key]&&META[key].type==="bracket_slot")) return "ko";
  if(key.startsWith("side|")) return "side";
  return null;
}
function updateTabCounts(){
  const c={matches:0,ko:0,side:0};
  Object.keys(META).forEach(k=>{ const t=tabOf(k); if(t && hasVal(VALUES[k])) c[t]++; });
  const set=(id,n)=>{ const e=$(id); if(e) e.textContent = n?(" "+n):""; };
  set("#tc-matches",c.matches); set("#tc-ko",c.ko); set("#tc-side",c.side);
}

function countTokens(){ const c={Double:0,Triple:0,AllIn:0};
  Object.values(VALUES).forEach(v=>{ if(v.token && c[v.token]!==undefined) c[v.token]++; }); return c; }
function updateReserves(){
  const used=countTokens(); const r=$("#reserves");
  r.innerHTML = Object.entries(START).map(([k,tot])=>{
    const left=tot-used[k]; const lab=k==="AllIn"?"A":k[0];
    return `<span class="chip ${left===0?'empty':''}">${lab} ${left}/${tot}</span>`;
  }).join('');
}
function updateSummary(){
  updateTabCounts();
  const total=Object.values(VALUES).filter(v=>v.team_id||v.player_id||v.player_text||v.outcome||v.scalar!==undefined&&v.scalar!==""||v.token).length;
  const used=countTokens();
  const el=$("#summary"); if(!el) return;
  el.innerHTML = `<span>Picks made <b>${total}</b></span>
    <span>Tokens placed <b>${used.Double+used.Triple+used.AllIn}/7</b></span>
    <span>Double <b>${used.Double}/4</b></span><span>Triple <b>${used.Triple}/2</b></span><span>All-In <b>${used.AllIn}/1</b></span>`;
}

function onChange(e){
  const key=e.target.dataset.key, role=e.target.dataset.role; if(!key||LOCKED) return;
  VALUES[key] = VALUES[key] || {};
  if(role==="team"){ VALUES[key].team_id = e.target.value || undefined; }
  else if(role==="player"){ VALUES[key].player_id = e.target.value || undefined; }
  else if(role==="text"){ VALUES[key].player_text = e.target.value || undefined; }
  else if(role==="outcome"){ VALUES[key].outcome = e.target.value || undefined; }
  else if(role==="score_home"){ VALUES[key].score_home = e.target.value===""?undefined:Number(e.target.value); }
  else if(role==="score_away"){ VALUES[key].score_away = e.target.value===""?undefined:Number(e.target.value); }
  else if(role==="scalar"){ VALUES[key].scalar = e.target.value===""?undefined:Number(e.target.value); }
  else if(role==="note"){ VALUES[key].note = e.target.value || undefined; }
  else if(role==="token"){
    const prev = VALUES[key].token || "";
    const attempted = e.target.value;
    VALUES[key].token = attempted || undefined;
    const used=countTokens();
    if(Object.entries(START).some(([k,t])=>used[k]>t)){
      VALUES[key].token = prev||undefined; e.target.value = prev;   // revert — over budget
      const L={Double:"Double",Triple:"Triple",AllIn:"All-In"};
      flash("No "+(L[attempted]||attempted)+" tokens left");
    }
    document.getElementById("row-"+key).classList.toggle("tokened", !!VALUES[key].token);
    updateReserves();
  }
  updateSummary();
}
function flash(msg){ const s=$("#status"); s.textContent="⚠ "+msg; s.style.color="var(--bad)";
  setTimeout(()=>{ s.textContent=""; s.style.color=""; },2200); }

function collectPicks(){
  return Object.keys(META).map(key=>{
    const v=VALUES[key]||{}; const m=META[key];
    const has = v.team_id||v.player_id||v.player_text||v.outcome||(v.score_home!=null&&v.score_home!=="")||(v.scalar!==undefined&&v.scalar!=="")||v.token||v.note;
    if(!has) return null;
    const p={key, type:m.type};
    if(m.bracket_slot) p.bracket_slot=m.bracket_slot;
    if(m.side_game) p.side_game=m.side_game;
    if(m.match_id!=null) p.match_id=m.match_id;
    if(v.team_id) p.team_id=v.team_id;
    if(v.player_id) p.player_id=v.player_id;
    if(v.player_text) p.player_text=v.player_text;
    if(v.outcome) p.outcome=v.outcome;
    if(v.score_home!=null&&v.score_home!=="") p.score_home=v.score_home;
    if(v.score_away!=null&&v.score_away!=="") p.score_away=v.score_away;
    if(v.scalar!==undefined&&v.scalar!=="") p.scalar=v.scalar;
    if(v.token) p.token=v.token;
    if(v.note) p.pundit_note=v.note;
    return p;
  }).filter(Boolean);
}

async function save(){
  const btn=$("#saveBtn"), s=$("#status"); btn.disabled=true; s.style.color=""; s.textContent="Saving…";
  try{
    const picks=collectPicks();
    const res=await fetch(api("/api/save"),{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({player:PLAYER,picks})});
    const j=await res.json(); if(!res.ok) throw new Error(j.error||"save failed");
    s.style.color="var(--good)"; s.textContent=`Saved ✓ ${j.saved} picks`;
  }catch(err){ s.style.color="var(--bad)"; s.textContent="Save failed: "+err.message; }
  finally{ btn.disabled=false; setTimeout(()=>{ if($("#status").textContent.startsWith("Saved")) $("#status").textContent=""; },3000); }
}
async function lockBracket(){
  if(!confirm("Lock "+PLAYER+"'s bracket? Picks become immutable and visible to your opponent.")) return;
  await save();
  try{
    const res=await fetch(api("/api/lock"),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({player:PLAYER})});
    const j=await res.json(); if(!res.ok) throw new Error(j.error||"lock failed");
    LOCKED=true; setLockedUI();
  }catch(err){ showErr("Lock failed: "+err.message); }
}
function setLockedUI(){
  $("#lockBanner").style.display="block";
  document.querySelectorAll("select,input").forEach(el=>{ if(!el.closest(".seg")) el.disabled=true; });
  const lb=$("#lockBtn"); if(lb){ lb.disabled=true; lb.textContent="Locked"; lb.style.opacity=".5"; }
}
function showErr(m){ const b=$("#errBanner"); b.textContent="⚠ "+m; b.style.display="block"; setTimeout(()=>b.style.display="none",5000); }

async function loadPlayer(player){
  PLAYER=player||PLAYER; LOCKED=false; VALUES={};
  $("#lockBanner").style.display="none";
  $("#tabs").style.display="none";
  $("#app").innerHTML='<div class="loading">Loading picks…</div>';
  try{
    const url = TOKEN ? api("/api/bootstrap") : ("/api/bootstrap?player="+encodeURIComponent(player));
    const res=await fetch(url);
    DATA=await res.json(); if(!res.ok) throw new Error(DATA.error||"load failed");
    PLAYER = DATA.player || PLAYER;
    if(TOKEN){ const w=$("#whoami"); w.textContent=PLAYER+"'s picks"; w.style.display=""; }
    LOCKED=!!DATA.locked;
    (DATA.existing||[]).forEach(p=>{ VALUES[p.key]={
      team_id:p.team_id!=null?String(p.team_id):undefined,
      player_id:p.player_id!=null?String(p.player_id):undefined, player_text:p.player_text||undefined,
      outcome:p.outcome||undefined,
      score_home:(p.score_home!=null?p.score_home:undefined), score_away:(p.score_away!=null?p.score_away:undefined),
      scalar:(p.scalar!=null?p.scalar:undefined), token:p.token||undefined, note:p.note||undefined }; });
    render();
  }catch(err){ $("#app").innerHTML=""; showErr("Couldn't load — is the base built & server running? ("+err.message+")"); }
}

$("#app").addEventListener("change", onChange);
$("#app").addEventListener("input", e=>{ if(["text","note","scalar","score_home","score_away"].includes(e.target.dataset.role)) onChange(e); });
document.addEventListener("click", e=>{
  if(e.target.id==="saveBtn") save();
  if(e.target.id==="lockBtn") lockBracket();
  const tb=e.target.closest && e.target.closest("#tabs button");
  if(tb){ setTab(tb.dataset.tab); }
  if(e.target.dataset.player){
    document.querySelectorAll("#playerSeg button").forEach(b=>b.classList.remove("on"));
    e.target.classList.add("on"); loadPlayer(e.target.dataset.player);
  }
});
const LOCAL = location.hostname==="127.0.0.1" || location.hostname==="localhost";
if(TOKEN){ $("#playerSeg").style.display="none"; loadPlayer(); }
else if(!LOCAL){ $("#playerSeg").style.display="none";
  $("#app").innerHTML='<div class="loading">Open your personal pick-entry link (the one ending in ?p=…) to continue.</div>'; }
else { loadPlayer("Andreas"); }   // local server: Andreas/Cal toggle
</script>
</body>
</html>
