<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World Cup 2026 — Pick Entry</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Antonio:wght@300;400;500;600;700&family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0b10; --card:#14161d; --card-soft:#1a1d26; --border:rgba(255,255,255,0.08);
    --border-strong:rgba(255,255,255,0.16); --text:#f0f0f3; --text-dim:#8a8c94; --text-mute:#5a5c64;
    --accent:#ff1c5c; --gold:#e8b948; --gold-soft:rgba(232,185,72,0.14);
    --andreas:#219ebc; --andreas-soft:rgba(33,158,188,0.16); --cal:#fb8500; --cal-soft:rgba(251,133,0,0.15);
    --good:#5ade8c; --bad:#ff5a5a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:'Inter',-apple-system,sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:80px}
  .wrap{max-width:760px;margin:0 auto;padding:0 18px}

  /* sticky header */
  .topbar{position:sticky;top:0;z-index:20;background:rgba(10,11,16,0.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
  .topbar-in{max-width:760px;margin:0 auto;padding:14px 18px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .brand{font-family:'Antonio',sans-serif;font-weight:600;font-size:22px;letter-spacing:.02em}
  .brand .yr{color:var(--accent);font-weight:700}
  .seg{display:flex;border:1px solid var(--border-strong);border-radius:6px;overflow:hidden}
  .seg button{background:transparent;border:none;cursor:pointer;font-family:'Antonio',sans-serif;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-dim);padding:7px 14px;font-weight:500}
  .seg button+button{border-left:1px solid var(--border)}
  .seg button.on{background:var(--andreas-soft);color:var(--andreas)}
  .seg button.cal.on{background:var(--cal-soft);color:var(--cal)}
  .reserves{display:flex;gap:10px;margin-left:auto;align-items:center}
  .chip{font-family:'Antonio',sans-serif;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);background:var(--gold-soft);border:1px solid rgba(232,185,72,.3);border-radius:5px;padding:5px 9px;font-weight:600}
  .chip.empty{color:var(--text-mute);background:transparent;border-color:var(--border)}
  .btn{font-family:'Antonio',sans-serif;font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;border:none;border-radius:6px;padding:9px 16px;cursor:pointer}
  .btn.save{background:var(--accent);color:#fff}
  .btn.save:disabled{opacity:.5;cursor:default}
  .status{font-size:12px;color:var(--text-dim);min-height:16px;font-family:'Antonio',sans-serif;letter-spacing:.06em}

  /* sections */
  h2{font-family:'Antonio',sans-serif;font-weight:600;font-size:20px;letter-spacing:.04em;margin:34px 0 4px;text-transform:uppercase}
  h2 .pts{font-size:12px;color:var(--text-mute);letter-spacing:.08em;margin-left:8px}
  .sub{color:var(--text-dim);font-size:13px;margin-bottom:14px;line-height:1.5}
  .grp-label{font-family:'Antonio',sans-serif;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin:20px 0 8px;font-weight:500}

  .row{display:grid;grid-template-columns:120px 1fr 122px;gap:10px;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:6px;padding:10px 12px;margin-bottom:8px}
  .row.tokened{border-color:rgba(232,185,72,.4)}
  .row.mrow{grid-template-columns:170px 1fr 110px}
  .mctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .mctl select{width:auto;min-width:118px}
  .scorebox{display:inline-flex;align-items:center;gap:5px}
  .scorebox input{width:46px;text-align:center;padding:6px 4px}
  .scorebox b{color:var(--text-mute);font-weight:600}
  .pwrap{display:flex;flex-direction:column;gap:6px}
  .pwrap .pfind{font-size:13px;padding:6px 10px;color:var(--text-dim)}

  /* tab bar (second row of the sticky header) */
  .tabs{max-width:760px;margin:0 auto;padding:0 18px;display:flex;gap:2px;border-top:1px solid var(--border);overflow-x:auto}
  .tabs button{background:transparent;border:none;border-bottom:2px solid transparent;cursor:pointer;font-family:'Antonio',sans-serif;font-size:13px;letter-spacing:.07em;text-transform:uppercase;color:var(--text-dim);padding:11px 13px;font-weight:500;white-space:nowrap}
  .tabs button:hover{color:var(--text)}
  .tabs button.on{color:var(--text);border-bottom-color:var(--accent)}
  .tabs .tc{color:var(--gold);font-size:11px}
  .tabpanel{display:none}
  .tabpanel.active{display:block}
  /* mulligan panel */
  .mullbox{border:1px solid var(--border);border-radius:10px;padding:16px 18px;margin-top:14px;max-width:580px}
  .mullrow{display:flex;align-items:center;gap:12px;margin:11px 0}
  .mullrow label{flex:0 0 84px;color:var(--text-dim);font-size:13px}
  .mullrow select{flex:1;padding:7px 8px}
  .mullbtns{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
  .mullout{margin-top:14px;font-size:14px;line-height:1.55;min-height:1.2em}
  .row .lab{font-family:'Antonio',sans-serif;font-size:13px;letter-spacing:.05em;color:var(--text-dim);text-transform:uppercase}
  .row .note{grid-column:2 / 4;margin-top:2px}
  select,input{width:100%;background:var(--card-soft);border:1px solid var(--border-strong);border-radius:5px;color:var(--text);font-family:'Inter',sans-serif;font-size:14px;padding:8px 10px;outline:none}
  select:focus,input:focus{border-color:var(--andreas)}
  input.note-in{font-size:13px;color:var(--text-dim);border-style:dashed}
  select[data-role=token]{font-family:'Antonio',sans-serif;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
  .row.tokened select[data-role=token]{color:var(--gold);border-color:rgba(232,185,72,.5)}

  .warnbox{margin:20px 0 0;padding:14px 16px;border:1px solid rgba(232,185,72,.4);border-radius:8px;background:var(--gold-soft)}
  .warnbox b{font-family:'Antonio',sans-serif;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
  .warnbox ul{margin:8px 0 0 18px;font-size:13px;color:var(--text-dim);line-height:1.6}
  .okline{margin:20px 0 0;font-family:'Antonio',sans-serif;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--good)}
  .conswarn{display:none;margin:6px 0 10px;padding:7px 10px;border:1px solid rgba(232,185,72,.4);border-radius:6px;background:var(--gold-soft);color:var(--text-dim);font-size:12.5px;line-height:1.5}
  .lockbar{margin:36px 0 10px;padding:18px;border:1px solid var(--border-strong);border-radius:8px;background:var(--card)}
  .lockbar .summary{display:flex;gap:22px;flex-wrap:wrap;font-family:'Antonio',sans-serif;font-size:13px;letter-spacing:.06em;color:var(--text-dim);text-transform:uppercase;margin-bottom:14px}
  .lockbar .summary b{color:var(--text);font-size:18px;font-family:'Cormorant Garamond',serif}
  .btn.lock{background:var(--gold);color:#1a1500}
  .banner{display:none;padding:12px 16px;border-radius:6px;margin:16px 0;font-family:'Antonio',sans-serif;letter-spacing:.06em;text-transform:uppercase;font-size:13px}
  .banner.locked{display:block;background:var(--gold-soft);color:var(--gold);border:1px solid rgba(232,185,72,.4)}
  .banner.err{background:rgba(255,90,90,.12);color:var(--bad);border:1px solid rgba(255,90,90,.4)}
  .hint{font-size:12px;color:var(--text-mute);margin-top:6px}
  .bsave{font-size:11px;letter-spacing:.04em;white-space:nowrap;opacity:0;transition:opacity .15s;font-family:'Antonio',sans-serif;text-transform:uppercase}
  .bsave.saving{opacity:1;color:var(--text-mute)}
  .bsave.saved{opacity:1;color:var(--good)}
  .bsave.retry{opacity:1;color:var(--gold)}
  .bsave.error{opacity:1;color:var(--bad)}
  .loading{padding:60px 0;text-align:center;color:var(--text-dim);font-family:'Antonio',sans-serif;letter-spacing:.1em;text-transform:uppercase}

  /* propagated bracket: group-order cards */
  .gocards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
  .gocard{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px 12px}
  .gohead{font-family:'Antonio',sans-serif;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:8px;font-weight:500;display:flex;align-items:center;gap:8px}
  .gohead .ok{color:var(--good)}
  .goreset{margin-left:auto;background:transparent;border:none;color:var(--text-mute);cursor:pointer;font-size:11px;font-family:'Antonio',sans-serif;letter-spacing:.08em;text-transform:uppercase}
  .goreset:hover{color:var(--text-dim)}
  .goteam{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:var(--card-soft);border:1px solid var(--border);border-radius:5px;color:var(--text);font-family:'Inter',sans-serif;font-size:13px;padding:7px 9px;margin-bottom:5px;cursor:pointer}
  .goteam:hover{border-color:var(--border-strong)}
  .goteam .gobadge{flex:0 0 18px;height:18px;border-radius:50%;font-family:'Antonio',sans-serif;font-size:11px;font-weight:700;line-height:18px;text-align:center;background:transparent;border:1px dashed var(--border-strong);color:var(--text-mute)}
  .goteam.ranked .gobadge{border-style:solid;background:var(--accent);border-color:var(--accent);color:#fff}
  .goteam.ranked.r3 .gobadge{background:var(--gold);border-color:var(--gold);color:#1a1500}
  .goteam.ranked{border-color:var(--border-strong)}
  .goname{color:var(--text-dim);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* best thirds */
  .thirds{display:flex;flex-wrap:wrap;gap:8px}
  .tchip{display:inline-flex;align-items:center;gap:6px;background:var(--card-soft);border:1px solid var(--border-strong);border-radius:6px;color:var(--text);font-family:'Inter',sans-serif;font-size:13px;padding:7px 11px;cursor:pointer}
  .tchip.on{background:var(--gold-soft);border-color:rgba(232,185,72,.55);color:var(--gold)}
  .tchip.on .goname{color:var(--gold)}

  /* bracket match rows */
  .row.brow{grid-template-columns:74px 1fr 122px}
  .bchips{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .bvs{color:var(--text-mute);font-family:'Antonio',sans-serif;font-size:11px}
  .bchip{display:inline-flex;align-items:center;gap:6px;background:var(--card-soft);border:1px solid var(--border-strong);border-radius:6px;color:var(--text);font-family:'Inter',sans-serif;font-size:13px;padding:7px 10px;cursor:pointer;max-width:230px}
  .bchip:hover{border-color:var(--andreas)}
  .bchip.on{background:var(--andreas-soft);border-color:var(--andreas);color:var(--text)}
  .bchip.on:hover{border-color:var(--bad)}
  .bchip.ghost{border-style:dashed;color:var(--text-mute);cursor:default;background:transparent}
  .bsrc{font-family:'Antonio',sans-serif;font-size:10px;letter-spacing:.06em;color:var(--text-mute);border:1px solid var(--border);border-radius:3px;padding:1px 4px}
  .bchip.on .bsrc{color:var(--andreas);border-color:rgba(33,158,188,.4)}
  .bgate{padding:18px;border:1px dashed var(--border-strong);border-radius:8px;color:var(--text-dim);font-size:13px;line-height:1.6}
</style>
</head>
<body>
<div class="topbar"><div class="topbar-in">
  <div class="brand">World Cup <span class="yr">26</span> · Picks</div>
  <div class="seg" id="playerSeg">
    <button data-player="Andreas" class="on">Andreas</button>
    <button data-player="Cal" class="cal">Cal</button>
  </div>
  <span class="chip" id="whoami" style="display:none"></span>
  <div class="reserves" id="reserves"></div>
  <button class="btn save" id="saveBtn">Save</button>
  <span class="status" id="status"></span>
</div>
<div class="tabs" id="tabs" style="display:none">
  <button data-tab="matches" class="on">Group matches<span class="tc" id="tc-matches"></span></button>
  <button data-tab="ko">Knockouts<span class="tc" id="tc-ko"></span></button>
  <button data-tab="side">Side bets<span class="tc" id="tc-side"></span></button>
  <button data-tab="bonus">Bonus bets<span class="tc" id="tc-bonus"></span></button>
  <button data-tab="review">Review &amp; Lock</button>
  <button data-tab="mulligan" id="mullTab" style="display:none">Mulligan</button>
</div></div>

<div class="wrap">
  <div id="lockBanner" class="banner locked">🔒 This bracket is locked — view only.</div>
  <div id="errBanner" class="banner err"></div>
  <div id="app"><div class="loading">Loading picks…</div></div>
</div>

<script>

// "No" on Over 2.5 means Under 2.5 (one bet type covers the spec's Over/Under row).
const BONUS_TYPES = [
  ["BTTS","BTTS · 10","Yes","No"],
  ["Over 2.5 goals","Over/Under 2.5 · 10","Over","Under"],
  ["Penalty in match","Penalty · 15","Yes","No"],
  ["Red card in match","Red card · 20","Yes","No"],
  ["Both teams score 2+","Both score 2+ · 15","Yes","No"],
  ["Goal in first 15 min","Goal in first 15′ · 15","Yes","No"],
];
function matchStarted(m){
  if(m.status && m.status!=="Scheduled") return true;
  return !!(m.kickoff && new Date(m.kickoff) <= new Date());
}
// ---- propagated bracket -----------------------------------------------------
// The bracket is GENERATED from group-stage calls: order each group 1-2-3, choose
// which 8 thirds advance, then advance teams match by match to the title. Storage
// stays the spec's order-free sets — slot keys R16-1..16 / QF-1..8 / SF-1..4 /
// F-1..2 / Champion — plus 13 unscored "bracket_struct" rows (group_order|A..L,
// thirds_advance) that persist the generating structure. Scoring is untouched:
// the engine pays sets per round and ignores bracket_struct entirely.
const ROUNDS = [
  {key:"R32", label:"Round of 32", n:16, prefix:"R16-",     pts:5,   slotName:"R16 berth"},
  {key:"R16", label:"Round of 16", n:8,  prefix:"QF-",      pts:10,  slotName:"QF berth"},
  {key:"QF",  label:"Quarter-finals", n:4, prefix:"SF-",    pts:20,  slotName:"SF berth"},
  {key:"SF",  label:"Semi-finals", n:2,  prefix:"F-",       pts:40,  slotName:"Final berth"},
  {key:"F",   label:"Final", n:1,        prefix:"Champion", pts:150, slotName:"crown"},
];
function slotKeyOf(ri,idx){ const r=ROUNDS[ri]; return r.prefix==="Champion"?"Champion":r.prefix+idx; }
const ALL_SLOT_KEYS = ROUNDS.flatMap((r,ri)=>Array.from({length:r.n},(_,i)=>slotKeyOf(ri,i+1)));

// R32 index i (1–16) = FIFA match 72+i. Eight group winners (E,I,A,L,D,G,B,K)

const THIRDS_ALLOC = (()=>{ const out={}, L="ABCDEFGHIJKL"; let r=0;

const FEEDS=[null,

  [[1,2],[5,6],[3,4],[7,8]],

  const p=[0]; f.forEach((pair,i)=>pair.forEach(j=>{p[j]=i+1;})); return p; });

function buildR32(go, thirds){
  const ok = GROUPS.every(g=>(go[g]||[]).length===3) && (thirds||[]).length===8;
  if(!ok) return null;
  const al=THIRDS_ALLOC[thirds.slice().sort().join("")];
  if(!al) return null;
  const tof={A:al[0],B:al[1],D:al[2],E:al[3],G:al[4],I:al[5],K:al[6],L:al[7]};
  const W=l=>({id:String(go[l][0]), src:l+"1"});
  const RU=l=>({id:String(go[l][1]), src:l+"2"});
  const TH=l=>({id:String(go[tof[l]][2]), src:tof[l]+"3"});
  return [
    [RU("A"),RU("B")],[W("E"),TH("E")],[W("F"),RU("C")],[W("C"),RU("F")],
    [W("I"),TH("I")],[RU("E"),RU("I")],[W("A"),TH("A")],[W("L"),TH("L")],
    [W("D"),TH("D")],[W("G"),TH("G")],[RU("K"),RU("L")],[W("H"),RU("J")],
    [W("B"),TH("B")],[W("J"),RU("H")],[W("K"),TH("K")],[RU("D"),RU("G")],

}
function chainIdx(m32, ri){ let m=m32; for(let i=1;i<=ri;i++) m=PARENT[i][m]; return m; }

// Surgical cascade: re-derive every slot from the team identities currently picked.
// A team that merely changes position keeps its pick (and token/note); a team that
// no longer advances drops out everywhere above; if two picks collide on one slot
// (they now meet earlier), both are voided so the user re-decides that tie.
function pruneAssign(vals, go, thirds){
  const ms=buildR32(go,thirds); if(!ms) return null;
  const m32of={}; ms.forEach((pair,i)=>pair.forEach(s=>m32of[s.id]=i+1));
  const out={};
  let inPrev = id => m32of[id]!=null;
  ROUNDS.forEach((r,ri)=>{
    const cur={};
    for(let k=1;k<=r.n;k++){ const v=vals[slotKeyOf(ri,k)]; if(v&&v.team_id) cur[String(v.team_id)]=v; }
    const byIdx={}, kept={};
    Object.keys(cur).forEach(id=>{
      if(!inPrev(id)) return;
      const idx=chainIdx(m32of[id], ri);
      byIdx[idx] = (byIdx[idx]===undefined) ? {id} : null;   // collision voids both
    });
    Object.keys(byIdx).forEach(idx=>{
      const e=byIdx[idx]; if(!e) return;
      const v=cur[e.id]||{};
      const slot={team_id:e.id};
      if(v.token) slot.token=v.token;
      if(v.note) slot.note=v.note;
      out[slotKeyOf(ri,+idx)]=slot;
      kept[e.id]=1;
    });
    inPrev = id => !!kept[id];
  });
  return out;
}

// ---- Mulligan (post-lock, June 26–28): re-pick one bracket slot OR the Dark Horse ----
// The window comes from the server (bootstrap → DATA.mulliganWindow), so it's edited in ONE
// place: pickentry_server.MULLIGAN_WINDOW. The literal here is only a fallback for a stale bootstrap.
function mullWindow(){ return (DATA && DATA.mulliganWindow) || ["2026-06-26","2026-06-28"]; }
function mullWindowState(){ const w=mullWindow(), d=new Date().toISOString().slice(0,10);
  return d<w[0]?"before":(d>w[1]?"after":"open"); }
function slotLabel(k){
  if(k==="Champion") return "Champion";
  const m=k.match(/^(R16|QF|SF|F)-(\d+)$/); if(!m) return k;
  return ({R16:"Round-of-16",QF:"Quarter-final",SF:"Semi-final",F:"Finalist"}[m[1]])+" #"+m[2];
}
function slotLabelOrDH(k){ return k==="darkhorse"?"Dark Horse":slotLabel(k); }
function mullTeamLabel(id){ const t=teamById(id); return t?((t.code?t.code+" · ":"")+t.name):("team "+id); }
function mulliganEligible(){
  const out=[], dh=VALUES["darkhorse"]||{};
  if(dh.team_id) out.push({key:"darkhorse", isDH:true, team_id:String(dh.team_id), label:"Dark Horse"});
  ALL_SLOT_KEYS.forEach(k=>{ const v=VALUES[k]||{}; if(v.team_id)
    out.push({key:k, isDH:false, team_id:String(v.team_id), label:slotLabel(k)}); });

}
function mulliganUsedRecord(){
  const k=Object.keys(VALUES).find(x=>x.endsWith("|mull") && (VALUES[x]||{}).team_id);

    swap <b>the instant you use it</b>, and it <b>can't be undone</b>. Window: <b>June ${a}–${b}</b>.</div>`;

    .filter(([k,n])=>n>0).map(([k,n])=>`<option value="${k}">${({Double:"Double ×2",Triple:"Triple ×3",AllIn:"All-In ×5"})[k]} (${n} left)</option>`).join("");
  return h+`<div class="mullbox">

    <div class="mullrow"><label>Token</label><select id="mull-token">${tokOpts}</select></div>
    <div class="mullbtns"><button class="btn" id="mull-preview">Preview (no commit)</button>
      <button class="btn lock" id="mull-confirm">Use my mulligan</button></div>

function populateMullReplace(){
  const t=$("#mull-target"), sel=$("#mull-replace"); if(!t||!sel) return;
  if(!t.value){ sel.innerHTML=`<option value="">— pick a target first —</option>`; return; }

async function mulliganRequest(dryRun){
  const target=($("#mull-target")||{}).value||"", team=($("#mull-replace")||{}).value||"";
  const token=($("#mull-token")||{}).value||"", out=$("#mull-out"); if(!out) return;
  if(!target){ out.style.color="var(--bad)"; out.textContent="Choose which pick to re-pick."; return; }
  if(!team){ out.style.color="var(--bad)"; out.textContent="Choose a replacement team."; return; }
  const replacement={team_id:team}; if(token) replacement.token=token;
  out.style.color=""; out.textContent=dryRun?"Previewing…":"Using your mulligan…";
  try{
    const res=await fetch(api("/api/mulligan"),{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({player:PLAYER, target, replacement, dryRun})});
    const j=await res.json(); if(!res.ok) throw new Error(j.error||"mulligan failed");
    if(dryRun){ out.style.color="var(--gold)"; out.innerHTML=
      `Preview only — nothing saved. This would change <b>${slotLabelOrDH(j.mulliganed)}</b> to <b>${j.replacement_code||team}</b>`+
      (j.token?` with a <b>${j.token}</b> token`:"")+`, mark both old &amp; new at 50%, and spend your mulligan (remaining → 0). Click <b>Use my mulligan</b> to commit.`; }
    else { out.style.color="var(--good)"; out.innerHTML=
      `✓ Mulligan used — <b>${slotLabelOrDH(j.mulliganed)}</b> → <b>${j.replacement_code||team}</b>. Both score at 50%, and your opponent can see it now.`;
      DATA.mulligansRemaining=0;
      ["mull-target","mull-replace","mull-token","mull-preview","mull-confirm"].forEach(id=>{const el=$("#"+id); if(el) el.disabled=true;}); }
  }catch(err){ out.style.color="var(--bad)"; out.textContent="✗ "+err.message; }
}
function confirmMulligan(){
  const t=$("#mull-target"), r=$("#mull-replace"), out=$("#mull-out");
  if(!t||!t.value){ if(out){out.style.color="var(--bad)";out.textContent="Choose which pick to re-pick.";} return; }
  if(!r||!r.value){ if(out){out.style.color="var(--bad)";out.textContent="Choose a replacement team.";} return; }
  if(!confirm(`Use your one mulligan?\n\n${t.options[t.selectedIndex].text}\n→ ${r.options[r.selectedIndex].text}\n\nBoth the old and new pick score at 50%. Your opponent sees this immediately. It cannot be undone.`)) return;

function hasVal(v){ return !!(v && (v.team_id||v.player_id||v.player_text||v.outcome||v.bet_type||(v.score_home!=null&&v.score_home!=="")||(v.scalar!==undefined&&v.scalar!=="")||v.token||v.note)); }
function tabOf(key){

function updateTabCounts(){

function countTokens(){ const c={Double:0,Triple:0,AllIn:0};
  Object.values(VALUES).forEach(v=>{ if(v.token && c[v.token]!==undefined) c[v.token]++; }); return c; }
function updateReserves(){

// --- group-pick consistency (advisory only — never blocks save or lock) -----
// From the match-outcome picks, each team's group points are exact where all its
// matches are called, and a [min,max] range where some are blank (a blank match
// can contribute 0 or 3). Warn ONLY when the called finishing order is
// mathematically impossible: a lower-placed team is guaranteed more points than
// a higher-placed one can possibly reach. Teams level on points stay silent —
// that's tiebreaker (GD/goals) territory we can't see from outcome picks.
function groupPointsRange(g){
  const pts={};
  (DATA.teams||[]).filter(t=>t.group===g).forEach(t=>{ pts[String(t.id)]={min:0,max:0,name:t.code||t.name||"?"}; });
  (DATA.matches||[]).filter(m=>m.group===g && String(m.round||"").toLowerCase().startsWith("group")).forEach(m=>{
    const h=String(m.home_id||""), a=String(m.away_id||"");
    if(!pts[h]||!pts[a]) return;
    const oc=(VALUES["match|"+m.fixture_id]||{}).outcome;
    if(oc==="Home"){ pts[h].min+=3; pts[h].max+=3; }
    else if(oc==="Away"){ pts[a].min+=3; pts[a].max+=3; }
    else if(oc==="Draw"){ pts[h].min+=1; pts[h].max+=1; pts[a].min+=1; pts[a].max+=1; }
    else { pts[h].max+=3; pts[a].max+=3; }                 // unpicked — anything can happen
  });
  return pts;
}
function groupConsistencyWarning(g){
  const order=BR.go[g]||[];
  if(order.length<3) return null;                          // standings not fully called
  const pts=groupPointsRange(g);
  const ids=Object.keys(pts);
  if(ids.length!==4) return null;                          // teams not loaded / pre-draw
  const ranked=[...order, ids.find(id=>!order.includes(id))].filter(Boolean);
  const ord=["1st","2nd","3rd","4th"];
  for(let lo=ranked.length-1;lo>0;lo--) for(let hi=0;hi<lo;hi++){
    const A=pts[ranked[hi]], B=pts[ranked[lo]];
    if(B && A && B.min>A.max){
      const bp=B.min===B.max?`${B.min} pts`:`at least ${B.min} pts`;
      return `Hey buddy, you sure about this? Your match picks give ${B.name} ${bp}, but you placed them ${ord[lo]} — behind ${A.name}, who can reach at most ${A.max}. One of the two needs to change.`;
    }
  }
  return null;
}
function updateGroupWarnings(){
  GROUPS.forEach(g=>{
    const msg=groupConsistencyWarning(g);
    ["gowarn-","mwarn-"].forEach(p=>{
      const el=document.getElementById(p+g); if(!el) return;
      el.textContent=msg?("⚠ "+msg):"";
      el.style.display=msg?"block":"none";
    });
  });
}

function updateSummary(){
  updateTabCounts();
  updateGroupWarnings();
  const total=Object.values(VALUES).filter(v=>v.team_id||v.player_id||v.player_text||v.outcome||v.bet_type||v.scalar!==undefined&&v.scalar!==""||v.token).length;
  const used=countTokens();
  const el=$("#summary"); if(!el) return;
  el.innerHTML = `<span>Picks made <b>${total}</b></span>
    <span>Tokens placed <b>${used.Double+used.Triple+used.AllIn}/7</b></span>
    <span>Double <b>${used.Double}/4</b></span><span>Triple <b>${used.Triple}/2</b></span><span>All-In <b>${used.AllIn}/1</b></span>`;
  const cw=$("#coherence");
  if(cw){
    // The propagated tree can't produce an incoherent bracket — completeness is the only thing to check.
    const p=bracketProgress(), missing=[];
    if(p.groups<12) missing.push(`order ${12-p.groups} more group${12-p.groups===1?"":"s"}`);
    if(p.thirds<8) missing.push(`choose ${8-p.thirds} more advancing third${8-p.thirds===1?"":"s"}`);
    if(p.groups===12&&p.thirds===8&&p.slots<31) missing.push(`advance ${31-p.slots} more bracket slot${31-p.slots===1?"":"s"} (ties without a winner score nothing)`);
    cw.innerHTML = missing.length
      ? `<div class="warnbox"><b>⚠ Bracket incomplete (won't block locking)</b><ul>`+
        missing.map(x=>`<li>${x}</li>`).join("")+`</ul></div>`
      : `<div class="okline">Bracket complete ✓ 12 groups · 8 thirds · 31 slots</div>`;
  }
}

function onChange(e){
  const key=e.target.dataset.key, role=e.target.dataset.role; if(!key) return;
  // After the main lock, the bonus tab stays live (setLockedUI leaves it enabled) —
  // accept edits ONLY for bonus-bet keys on matches that haven't kicked off.
  if(LOCKED && !(key.startsWith("bonus|") && META[key] && META[key].type==="bonus_bet" && !META[key].started)) return;
  VALUES[key] = VALUES[key] || {};
  if(role==="team"){ VALUES[key].team_id = e.target.value || undefined; }   // bracket slots are tree-generated now; this only serves Dark Horse
  else if(role==="player"){ VALUES[key].player_id = e.target.value || undefined; }
  else if(role==="text"){ VALUES[key].player_text = e.target.value || undefined; }
  else if(role==="outcome"){ VALUES[key].outcome = e.target.value || undefined; }
  else if(role==="score_home"){ VALUES[key].score_home = e.target.value===""?undefined:Number(e.target.value); }
  else if(role==="score_away"){ VALUES[key].score_away = e.target.value===""?undefined:Number(e.target.value); }
  else if(role==="scalar"){ VALUES[key].scalar = e.target.value===""?undefined:Number(e.target.value); }
  else if(role==="bet_type"){
    VALUES[key].bet_type = e.target.value || undefined;
    const vs = document.querySelector(`select[data-role="bet_value"][data-key="${CSS.escape(key)}"]`);
    if(vs) vs.innerHTML = betValueOptions(VALUES[key].bet_type, VALUES[key].bet_value);
  }
  else if(role==="bet_value"){ VALUES[key].bet_value = e.target.value || undefined; }
  else if(role==="note"){ VALUES[key].note = e.target.value || undefined; }
  else if(role==="token"){
    const prev = VALUES[key].token || "";
    const attempted = e.target.value;
    VALUES[key].token = attempted || undefined;
    const used=countTokens();
    if(Object.entries(START).some(([k,t])=>used[k]>t)){
      VALUES[key].token = prev||undefined; e.target.value = prev;   // revert — over budget
      const L={Double:"Double",Triple:"Triple",AllIn:"All-In"};
      flash("No "+(L[attempted]||attempted)+" tokens left");
    }
    document.getElementById("row-"+key).classList.toggle("tokened", !!VALUES[key].token);
    updateReserves();
  }
  // Autosave editable bonus-bet rows (type/value/token/note) — same lock rule as the guard above
  if(key.startsWith("bonus|") && META[key] && META[key].type==="bonus_bet" && !META[key].started){
    markBonusDirty(key); scheduleBonusAutosave();
  }
  updateSummary();
}
function flash(msg){ const s=$("#status"); s.textContent="⚠ "+msg; s.style.color="var(--bad)";
  setTimeout(()=>{ s.textContent=""; s.style.color=""; },2200); }

function collectPicks(){
  // bonus bets have their own save path (/api/savebonus) and their own lock rhythm
  return Object.keys(META).filter(key=>META[key].type!=="bonus_bet").map(key=>{
    const v=VALUES[key]||{}; const m=META[key];
    const has = v.team_id||v.player_id||v.player_text||v.outcome||(v.score_home!=null&&v.score_home!=="")||(v.scalar!==undefined&&v.scalar!=="")||v.token||v.note;
    if(!has) return null;
    const p={key, type:m.type};
    if(m.bracket_slot) p.bracket_slot=m.bracket_slot;
    if(m.side_game) p.side_game=m.side_game;
    if(m.match_id!=null) p.match_id=m.match_id;
    if(v.team_id) p.team_id=v.team_id;
    if(v.player_id) p.player_id=v.player_id;
    if(v.player_text) p.player_text=v.player_text;
    if(v.outcome) p.outcome=v.outcome;
    if(v.score_home!=null&&v.score_home!=="") p.score_home=v.score_home;
    if(v.score_away!=null&&v.score_away!=="") p.score_away=v.score_away;
    if(v.scalar!==undefined&&v.scalar!=="") p.scalar=v.scalar;
    if(v.token) p.token=v.token;
    if(v.note) p.pundit_note=v.note;
    return p;
  }).filter(Boolean);
}

function collectBonusPicks(){
  return Object.keys(META).filter(key=>{
    const m=META[key];
    return m.type==="bonus_bet" && !m.started;        // started matches are immutable
  }).map(key=>{
    const v=VALUES[key]||{}; const m=META[key];
    if(!v.bet_type || !v.bet_value) return null;       // a bet needs both halves
    const p={key, type:"bonus_bet", match_id:m.match_id, bet_type:v.bet_type, bet_value:v.bet_value};
    if(v.token) p.token=v.token;
    if(v.note) p.pundit_note=v.note;
    return p;
  }).filter(Boolean);
}

// Bonus bets autosave — any editable bonus-row change schedules a debounced
// save (~700ms after you stop), so picking type-then-value is one POST not two.
// The manual "Save bonus bets" button stays as a backup and calls the same path.
// A failed save auto-retries with linear backoff (idempotent: /api/savebonus
// upserts by stable per-slot label, so resending can't duplicate a record).
// Only transient failures retry — 4xx validation errors are surfaced, not looped.
let bonusAutosaveTimer=null, bonusSaveInFlight=false, bonusSaveQueued=false;
let bonusRetryTimer=null, bonusRetryCount=0;
const BONUS_RETRY_MAX=4, BONUS_RETRY_MS=2500;
// Per-row inline indicator. bonusDirty = rows edited since their last confirmed
// save; bonusSaveState mirrors each row's badge so the auto-clear only fires if
// the row is still showing "saved" (not re-edited).
const bonusDirty=new Set(), bonusSaveState={};
function setRowSave(key,state){
  bonusSaveState[key]=state||undefined;
  const el=document.getElementById("bsave-"+key); if(!el) return;
  const map={saving:["Saving…","bsave saving"],saved:["Saved ✓","bsave saved"],
             retry:["Retrying…","bsave retry"],error:["Not saved","bsave error"]};
  const [txt,cls]=map[state]||["","bsave"];
  el.textContent=txt; el.className=cls;
}
function clearRowSaveLater(keys){ setTimeout(()=>keys.forEach(k=>{ if(bonusSaveState[k]==="saved") setRowSave(k,""); }),2000); }
function markBonusDirty(key){ bonusDirty.add(key); setRowSave(key,"saving"); }
function scheduleBonusAutosave(){
  clearTimeout(bonusAutosaveTimer);
  clearTimeout(bonusRetryTimer);   // a fresh user edit supersedes any pending retry
  bonusAutosaveTimer=setTimeout(()=>{ saveBonusBets({auto:true}); }, 700);
}
async function saveBonusBets(opts){
  opts=opts||{};
  // collapse a save that lands while another is in flight
  if(bonusSaveInFlight){ if(opts.auto) bonusSaveQueued=true; return; }
  bonusSaveInFlight=true;
  const savingKeys=[...bonusDirty];        // exactly the rows this POST's payload carries
  savingKeys.forEach(k=>setRowSave(k,"saving"));
  const btns=[...document.querySelectorAll("button.bonusSave")], s=$("#status");
  if(!opts.auto) btns.forEach(b=>b.disabled=true);
  s.style.color=""; s.textContent="Saving bonus bets…";
  try{
    const picks=collectBonusPicks();
    const res=await fetch(api("/api/savebonus"),{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({player:PLAYER,picks})});
    let j={}; try{ j=await res.json(); }catch(_){}
    if(!res.ok){ const e=new Error(j.error||("save failed ("+res.status+")"));
      e.transient=(res.status>=500||res.status===429); throw e; }   // 4xx → don't retry
    bonusRetryCount=0; clearTimeout(bonusRetryTimer);
    savingKeys.forEach(k=>bonusDirty.delete(k));    // edits added mid-flight stay dirty for the queued save
    savingKeys.forEach(k=>setRowSave(k,"saved")); clearRowSaveLater(savingKeys);
    s.style.color="var(--good)"; s.textContent=`Bonus bets saved ✓ ${j.saved}`;
  }catch(err){
    s.style.color="var(--bad)";
    const retryable = err.transient!==false;   // network reject (undefined) & 5xx/429 retry; 4xx don't
    if(retryable && bonusRetryCount<BONUS_RETRY_MAX){
      bonusRetryCount++;
      savingKeys.forEach(k=>setRowSave(k,"retry"));   // keys stay in bonusDirty so the retry resaves them
      s.textContent=`Bonus save hiccup — retrying (${bonusRetryCount}/${BONUS_RETRY_MAX})…`;
      clearTimeout(bonusRetryTimer);
      bonusRetryTimer=setTimeout(()=>{ saveBonusBets({auto:true}); }, BONUS_RETRY_MS*bonusRetryCount);
    } else {
      bonusRetryCount=0;
      savingKeys.forEach(k=>setRowSave(k,"error"));
      s.textContent="Bonus save failed: "+err.message;
    }
  }
  finally{ if(!opts.auto) btns.forEach(b=>b.disabled=false);
    bonusSaveInFlight=false;
    if(bonusSaveQueued){ bonusSaveQueued=false; scheduleBonusAutosave(); }   // flush the edit that arrived mid-save
    setTimeout(()=>{ if($("#status").textContent.startsWith("Bonus bets saved")) $("#status").textContent=""; },3000); }
}

async function save(){
  const btn=$("#saveBtn"), s=$("#status"); btn.disabled=true; s.style.color=""; s.textContent="Saving…";
  try{
    const picks=collectPicks();
    const res=await fetch(api("/api/save"),{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({player:PLAYER,picks})});
    const j=await res.json(); if(!res.ok) throw new Error(j.error||"save failed");
    s.style.color="var(--good)"; s.textContent=`Saved ✓ ${j.saved} picks`;
  }catch(err){ s.style.color="var(--bad)"; s.textContent="Save failed: "+err.message; }
  finally{ btn.disabled=false; setTimeout(()=>{ if($("#status").textContent.startsWith("Saved")) $("#status").textContent=""; },3000); }
}
async function lockBracket(){
  if(!confirm("Lock "+PLAYER+"'s bracket? Picks become immutable and visible to your opponent.")) return;
  await save();
  try{
    const res=await fetch(api("/api/lock"),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({player:PLAYER})});
    const j=await res.json(); if(!res.ok) throw new Error(j.error||"lock failed");
    LOCKED=true; setLockedUI();
  }catch(err){ showErr("Lock failed: "+err.message); }
}
function setLockedUI(){
  $("#lockBanner").style.display="block";
  const mt=$("#mullTab"); if(mt) mt.style.display="";   // mulligan tab is post-lock only
  // bonus bets keep their own per-match lock (kickoff), and the mulligan panel has its own
  // window gating + server guard — both tabs stay live after the main lock
  document.querySelectorAll("select,input").forEach(el=>{
    if(!el.closest(".seg") && !el.closest('.tabpanel[data-tab="bonus"]')
       && !el.closest('.tabpanel[data-tab="mulligan"]')) el.disabled=true; });
  const lb=$("#lockBtn"); if(lb){ lb.disabled=true; lb.textContent="Locked"; lb.style.opacity=".5"; }
}
function showErr(m){ const b=$("#errBanner"); b.textContent="⚠ "+m; b.style.display="block"; setTimeout(()=>b.style.display="none",5000); }

async function loadPlayer(player){
  PLAYER=player||PLAYER; LOCKED=false; VALUES={};
  $("#lockBanner").style.display="none";
  $("#tabs").style.display="none";
  $("#app").innerHTML='<div class="loading">Loading picks…</div>';
  try{
    const url = TOKEN ? api("/api/bootstrap") : ("/api/bootstrap?player="+encodeURIComponent(player));
    const res=await fetch(url);
    DATA=await res.json(); if(!res.ok) throw new Error(DATA.error||"load failed");
    PLAYER = DATA.player || PLAYER;
    if(TOKEN){ const w=$("#whoami"); w.textContent=PLAYER+"'s picks"; w.style.display=""; }
    LOCKED=!!DATA.locked;
    (DATA.existing||[]).forEach(p=>{ VALUES[p.key]={
      team_id:p.team_id!=null?String(p.team_id):undefined,
      player_id:p.player_id!=null?String(p.player_id):undefined, player_text:p.player_text||undefined,
      outcome:p.outcome||undefined,
      score_home:(p.score_home!=null?p.score_home:undefined), score_away:(p.score_away!=null?p.score_away:undefined),
      scalar:(p.scalar!=null?p.scalar:undefined),
      bet_type:p.bet_type||undefined, bet_value:p.bet_value||undefined,
      token:p.token||undefined, note:p.note||undefined }; });
    loadStructFromValues();   // rebuild group orders + thirds + pruned slots from saved structure
    render();
  }catch(err){ $("#app").innerHTML=""; showErr("Couldn't load — is the base built & server running? ("+err.message+")"); }
}

$("#app").addEventListener("change", onChange);
$("#app").addEventListener("change", e=>{ if(e.target.id==="mull-target") populateMullReplace(); });
$("#app").addEventListener("input", e=>{
  if(e.target.classList.contains("pfind")){
    const key=e.target.dataset.pkey;
    const sel=document.querySelector(`select[data-role="player"][data-key="${CSS.escape(key)}"]`);
    if(sel) sel.innerHTML=playerOptions((VALUES[key]||{}).player_id, e.target.dataset.pfilter||undefined, e.target.value.trim());
    return;
  }
  if(["text","note","scalar","score_home","score_away"].includes(e.target.dataset.role)) onChange(e);
});
function onBracketAct(b){
  const act=b.dataset.act;
  if(act==="rank"){
    const g=b.dataset.group, id=String(b.dataset.team);
    const o=BR.go[g]||(BR.go[g]=[]);
    const i=o.indexOf(id);
    if(i>=0) o.splice(i);                       // undo this rank and everything after it
    else if(o.length<3) o.push(id);
    else return flash("Group "+g+" is set — tap a ranked team to undo first");
  }
  else if(act==="goreset"){ BR.go[b.dataset.group]=[]; }
  else if(act==="third"){
    const l=b.dataset.letter, i=BR.thirds.indexOf(l);
    if(i>=0) BR.thirds.splice(i,1);
    else if(BR.thirds.length<8) BR.thirds.push(l);
    else return flash("Eight thirds max — deselect one first");
  }
  else if(act==="adv"){
    const k=b.dataset.target, id=String(b.dataset.team);
    if(String((VALUES[k]||{}).team_id||"")===id) delete VALUES[k];   // deselect → drops out upstream too
    else VALUES[k]={team_id:id};                                     // radio per tie; token/note start fresh
  }
  else return;
  propagateBR(); renderKOPanel();
}
document.addEventListener("click", e=>{
  if(e.target.id==="saveBtn") save();
  if(e.target.classList && e.target.classList.contains("bonusSave")) saveBonusBets();
  if(e.target.id==="lockBtn") lockBracket();
  if(e.target.id==="mull-preview") mulliganRequest(true);
  if(e.target.id==="mull-confirm") confirmMulligan();
  const ab=e.target.closest && e.target.closest("[data-act]");
  if(ab && !LOCKED) onBracketAct(ab);
  const tb=e.target.closest && e.target.closest("#tabs button");
  if(tb){ setTab(tb.dataset.tab); }
  if(e.target.dataset.player){
    document.querySelectorAll("#playerSeg button").forEach(b=>b.classList.remove("on"));
    e.target.classList.add("on"); loadPlayer(e.target.dataset.player);
  }
});

window.__T = { ROUNDS, ALL_SLOT_KEYS, GROUPS, slotKeyOf, buildR32, chainIdx, pruneAssign, teamOptions,
  structureComplete, syncStructValues, propagateBR, loadStructFromValues, bracketProgress,
  renderKOContent, collectPicks, onBracketAct, countTokens, onChange, collectBonusPicks,
  groupPointsRange, groupConsistencyWarning,
  renderMulliganContent, mulliganEligible, slotLabel, mullWindow, mullWindowState, mulliganUsedRecord,
  set(o){ if(o.DATA!==undefined)DATA=o.DATA; if(o.VALUES!==undefined)VALUES=o.VALUES;
          if(o.BR!==undefined)BR=o.BR; if(o.META!==undefined)META=o.META; if(o.LOCKED!==undefined)LOCKED=o.LOCKED; },
  get(){ return {DATA,VALUES,BR,META,LOCKED}; },
  bonusReset(){ bonusDirty.clear(); for(const k in bonusSaveState) delete bonusSaveState[k];
    bonusSaveInFlight=false; bonusSaveQueued=false; bonusRetryCount=0;
    clearTimeout(bonusRetryTimer); clearTimeout(bonusAutosaveTimer); } };

const LOCAL = location.hostname==="127.0.0.1" || location.hostname==="localhost";
if(TOKEN){ $("#playerSeg").style.display="none"; loadPlayer(); }
else if(!LOCAL){ $("#playerSeg").style.display="none";
  $("#app").innerHTML='<div class="loading">Open your personal pick-entry link (the one ending in ?p=…) to continue.</div>'; }
else { loadPlayer("Andreas"); }   // local server: Andreas/Cal toggle
