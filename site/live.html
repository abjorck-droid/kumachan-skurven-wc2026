<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World Cup 2026 — Andreas v Cal · Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Antonio:wght@300;400;500;600;700&family=Cormorant+Garamond:wght@500;600;700&family=Architects+Daughter&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0b10; --card:#14161d; --card-soft:#1a1d26; --border:rgba(255,255,255,0.08);
    --border-strong:rgba(255,255,255,0.16); --text:#f0f0f3; --text-dim:#8a8c94; --text-mute:#5a5c64;
    --accent:#ff1c5c; --accent-soft:rgba(255,28,92,0.12); --gold:#e8b948; --gold-soft:rgba(232,185,72,0.14);
    --p1:#219ebc; --p1-soft:rgba(33,158,188,0.16); --p2:#fb8500; --p2-soft:rgba(251,133,0,0.15);
    --good:#5ade8c; --bad:#ff5a5a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:radial-gradient(1200px 600px at 50% -10%, rgba(255,28,92,0.06), transparent 60%), var(--bg);
    color:var(--text);font-family:'Inter',-apple-system,sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:70px}
  .wrap{max-width:920px;margin:0 auto;padding:0 18px}

  /* header */
  .header{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:14px;
    max-width:920px;margin:0 auto;padding:26px 18px 18px;border-bottom:1px solid var(--border)}
  .title{font-family:'Antonio',sans-serif;font-weight:600;font-size:28px;line-height:1;letter-spacing:.02em}
  .title .yr{color:var(--accent);font-weight:700}
  .subtitle{font-family:'Antonio',sans-serif;font-weight:300;font-size:12px;color:var(--text-dim);
    letter-spacing:.14em;text-transform:uppercase;margin-top:6px}
  .h2h{display:flex;gap:26px}
  .h2h .col{text-align:right}
  .h2h .name{font-family:'Antonio',sans-serif;font-size:11px;letter-spacing:.15em;color:var(--text-dim);text-transform:uppercase}
  .h2h .score{font-family:'Cormorant Garamond',serif;font-size:36px;line-height:1;font-weight:600;margin-top:4px;
    font-variant-numeric:tabular-nums}
  .h2h .col.c1 .score{color:var(--p1)} .h2h .col.c2 .score{color:var(--p2)}
  .h2h .meta{font-family:'Antonio',sans-serif;font-size:10.5px;letter-spacing:.1em;color:var(--gold);
    text-transform:uppercase;margin-top:7px;font-weight:500}
  .h2h .lockst{font-size:10px;letter-spacing:.12em;margin-top:4px;font-family:'Antonio',sans-serif;text-transform:uppercase}
  .h2h .lockst.yes{color:var(--gold)} .h2h .lockst.no{color:var(--text-mute)}
  .h2h .streak{font-family:'Antonio',sans-serif;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;margin-top:3px}
  .h2h .streak.hot{color:var(--good)} .h2h .streak.cold{color:var(--text-dim)}

  /* sticky tab bar */
  .topbar{position:sticky;top:0;z-index:20;background:rgba(10,11,16,0.92);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border)}
  .tabs{max-width:920px;margin:0 auto;padding:0 18px;display:flex;gap:2px;overflow-x:auto}
  .tabs button{background:transparent;border:none;border-bottom:2px solid transparent;cursor:pointer;
    font-family:'Antonio',sans-serif;font-size:13px;letter-spacing:.07em;text-transform:uppercase;
    color:var(--text-dim);padding:12px 13px;font-weight:500;white-space:nowrap}
  .tabs button:hover{color:var(--text)}
  .tabs button.on{color:var(--text);border-bottom-color:var(--accent)}
  .tabpanel{display:none} .tabpanel.active{display:block}

  h2{font-family:'Antonio',sans-serif;font-weight:600;font-size:19px;letter-spacing:.04em;margin:30px 0 4px;text-transform:uppercase}
  h2 .pts{font-size:12px;color:var(--text-mute);letter-spacing:.08em;margin-left:8px}
  .sub{color:var(--text-dim);font-size:13px;margin-bottom:14px;line-height:1.5}
  .grp-label{font-family:'Antonio',sans-serif;font-size:12px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--accent);margin:22px 0 8px;font-weight:500}
  .updated{font-family:'Antonio',sans-serif;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--text-mute);text-align:right;margin:10px 0 0}
  .loading{padding:60px 0;text-align:center;color:var(--text-dim);font-family:'Antonio',sans-serif;
    letter-spacing:.1em;text-transform:uppercase}
  .banner{padding:12px 16px;border-radius:6px;margin:16px 0;font-family:'Antonio',sans-serif;
    letter-spacing:.06em;text-transform:uppercase;font-size:13px;background:rgba(255,90,90,.12);
    color:var(--bad);border:1px solid rgba(255,90,90,.4)}
  .notice{padding:11px 14px;border-radius:6px;margin:14px 0;font-size:13px;color:var(--text-dim);
    background:var(--card);border:1px dashed var(--border-strong)}

  /* match cards (mockup 04, live) */
  .cardgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:14px;align-items:start;margin-bottom:6px}
  .mcard{background:var(--card);border:1px solid var(--border);border-radius:6px;overflow:hidden}
  .mcard.is-live{border-color:rgba(255,56,56,.35)}
  .mc-meta{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;
    border-bottom:1px solid var(--border);font-family:'Antonio',sans-serif;font-size:11.5px;
    letter-spacing:.1em;text-transform:uppercase}
  .mc-meta .grp{color:var(--text-dim)} .mc-meta .venue{color:var(--text-mute)}
  .mc-meta .stage{color:var(--accent);font-weight:500}
  .pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:100px;
    font-family:'Antonio',sans-serif;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:500}
  .pill.locked{background:var(--accent-soft);color:var(--accent)}
  .pill.open{background:rgba(255,255,255,.06);color:var(--text-dim)}
  .pill.live{background:rgba(255,56,56,.15);color:#ff3838}
  .pill.live::before{content:'';width:6px;height:6px;border-radius:50%;background:#ff3838;animation:pulse 1.4s ease-in-out infinite}
  .pill.final{background:rgba(90,222,140,.12);color:var(--good)}
  .matchup{padding:15px 14px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px;border-bottom:1px solid var(--border)}
  .team{display:flex;flex-direction:column;gap:5px}
  .team.away{text-align:right;align-items:flex-end}
  .team .kitbar{height:4px;width:34px;border-radius:2px}
  .team .tcode{font-family:'Antonio',sans-serif;font-size:28px;font-weight:600;letter-spacing:.05em;line-height:1}
  .team .tname{font-size:10.5px;color:var(--text-dim);letter-spacing:.08em;text-transform:uppercase}
  .score-block{text-align:center;min-width:84px}
  .score-block .bigsc{font-family:'Cormorant Garamond',serif;font-size:38px;font-weight:500;line-height:1;font-variant-numeric:tabular-nums}
  .score-block .bigsc.pending{color:var(--text-mute)}
  .score-block .under{font-family:'Antonio',sans-serif;font-size:11px;color:var(--text-dim);letter-spacing:.1em;text-transform:uppercase;margin-top:5px}
  .score-block .under.livemin{color:#ff3838;font-weight:500}
  .predictions{display:grid;grid-template-columns:1fr 1fr}
  .pick{padding:13px 14px;position:relative;min-width:0}
  .pick.first{border-right:1px solid var(--border)}
  .pick-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}
  .pick-name{font-family:'Antonio',sans-serif;font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:500}
  .pick.c1 .pick-name{color:var(--p1)} .pick.c2 .pick-name{color:var(--p2)}
  .pick-pts{font-family:'Cormorant Garamond',serif;font-size:17px;font-weight:500;font-variant-numeric:tabular-nums}
  .pick-pts.zero{color:var(--text-mute)}
  .pick-score{font-family:'Cormorant Garamond',serif;font-size:23px;line-height:1;font-weight:500;margin-bottom:4px;font-variant-numeric:tabular-nums}
  .pick-score .pred-team{font-family:'Antonio',sans-serif;font-size:12px;color:var(--text-dim);letter-spacing:.08em;margin-left:5px}
  .pick-outcome{font-size:10.5px;color:var(--text-mute);letter-spacing:.08em;text-transform:uppercase;margin-bottom:9px}
  .pick-outcome.correct{color:var(--good)}
  .pick-outcome.wrong{color:var(--bad)}
  .pick .nopick{font-size:11px;color:var(--text-mute);letter-spacing:.08em;text-transform:uppercase}
  .tokchip{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:3px;background:var(--gold-soft);
    border:1px solid rgba(232,185,72,.3);color:var(--gold);font-family:'Antonio',sans-serif;font-size:10.5px;
    letter-spacing:.12em;text-transform:uppercase;font-weight:500;margin-bottom:9px}
  .tokchip.spent{opacity:.45}
  .tok-none{font-size:10.5px;color:var(--text-mute);letter-spacing:.08em;margin-bottom:9px;text-transform:uppercase}
  .pnote{border-top:1px dashed var(--border);padding-top:9px;font-size:14.5px;color:var(--text-dim);line-height:1.35;
    font-family:'Architects Daughter',cursive}
  .pnote.sealed{color:var(--text-mute);font-family:'Antonio',sans-serif;font-size:10.5px;letter-spacing:.12em;
    text-transform:uppercase;display:flex;align-items:center;gap:6px}
  .pnote.sealed::before{content:'◆';font-size:8px}
  .beat-flag{position:absolute;top:0;right:12px;background:var(--accent);color:#fff;font-family:'Antonio',sans-serif;
    font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;padding:3px 8px;border-radius:0 0 3px 3px;font-weight:500}
  .bstrip{padding:10px 14px;background:var(--card-soft);border-top:1px solid var(--border);
    display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
  .bstrip .blabel{font-family:'Antonio',sans-serif;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--text-dim);font-weight:500}
  .bstrip .bstate{display:flex;gap:14px;font-family:'Antonio',sans-serif;font-size:10.5px;letter-spacing:.08em;
    text-transform:uppercase;flex-wrap:wrap}
  .bstrip .person{display:flex;align-items:center;gap:6px;color:var(--text-mute)}
  .bstrip .person .dot{width:6px;height:6px;border-radius:50%;background:var(--text-mute);flex:0 0 6px}
  .bstrip .person.in{color:var(--text-dim)}
  .bstrip .person.in.w1 .dot{background:var(--p1)} .bstrip .person.in.w2 .dot{background:var(--p2)}
  .bstrip .person .hitm{color:var(--good)} .bstrip .person .missm{color:var(--bad)}
  .bstrip .person .voidm{color:var(--text-mute);font-style:italic}

  /* legacy compact rows (kept for bonus chip line reuse) */
  .mrow{display:grid;grid-template-columns:minmax(190px,1.1fr) 86px minmax(180px,1fr);gap:10px;align-items:center;
    background:var(--card);border:1px solid var(--border);border-radius:6px;padding:9px 12px;margin-bottom:7px}
  .mrow.live{border-color:rgba(255,28,92,.45)}
  .mteams{display:flex;align-items:center;gap:7px;font-family:'Antonio',sans-serif;font-size:15px;font-weight:600;letter-spacing:.04em}
  .mteams .kit{width:4px;height:16px;border-radius:2px;flex:0 0 4px}
  .mteams .vs{color:var(--text-mute);font-weight:300;font-size:12px}
  .mid{text-align:center}
  .mid .sc{font-family:'Cormorant Garamond',serif;font-size:21px;font-weight:700;font-variant-numeric:tabular-nums}
  .mid .st{font-family:'Antonio',sans-serif;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-mute);margin-top:1px}
  .mid .st.live{color:var(--accent);animation:pulse 1.6s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
  .mpicks{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}

  .chip{display:inline-flex;align-items:center;gap:5px;font-family:'Antonio',sans-serif;font-size:11.5px;
    letter-spacing:.05em;text-transform:uppercase;border-radius:5px;padding:4px 8px;font-weight:600;
    border:1px solid var(--border-strong);color:var(--text-dim);background:var(--card-soft)}
  .chip .ow{width:7px;height:7px;border-radius:50%;flex:0 0 7px}
  .chip.p1 .ow{background:var(--p1)} .chip.p2 .ow{background:var(--p2)}
  .chip.hit{border-color:rgba(90,222,140,.5);color:var(--good)}
  .chip.miss{border-color:rgba(255,90,90,.35);color:var(--text-mute);text-decoration:line-through}
  .chip.tok{border-color:rgba(232,185,72,.55)}
  .chip .tokmark{color:var(--gold);font-size:10px}
  .chip .pts{color:var(--gold);font-size:10.5px}
  .chip.hidden-pick{border-style:dashed;color:var(--text-mute);font-weight:400}
  .chip.void{opacity:.55;border-style:dashed;text-decoration:none}
  .bline{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;align-items:center;
    border-top:1px dashed var(--border);padding-top:6px;margin-top:2px}
  .bline .blab{font-family:'Antonio',sans-serif;font-size:9.5px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--text-mute)}

  /* scoreboard category table */
  .cats{display:grid;grid-template-columns:1fr auto auto;gap:0;background:var(--card);border:1px solid var(--border);
    border-radius:8px;overflow:hidden;margin-top:14px}
  .cats > div{padding:9px 14px;border-bottom:1px solid var(--border);font-size:13px}
  .cats .hd{font-family:'Antonio',sans-serif;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-dim);background:var(--card-soft)}
  .cats .num{font-family:'Cormorant Garamond',serif;font-size:17px;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
  .cats .num.c1{color:var(--p1)} .cats .num.c2{color:var(--p2)}
  .cats .tot{background:var(--card-soft);font-weight:600}

  /* bracket ladder compare */
  .ladder{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .ladder .side{background:var(--card);border:1px solid var(--border);border-radius:6px;padding:10px 12px}
  .ladder .side h4{font-family:'Antonio',sans-serif;font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:500;margin-bottom:8px}
  .ladder .side.s1 h4{color:var(--p1)} .ladder .side.s2 h4{color:var(--p2)}
  .teamtags{display:flex;flex-wrap:wrap;gap:6px}
  .ttag{display:inline-flex;align-items:center;gap:6px;font-family:'Antonio',sans-serif;font-size:13px;font-weight:600;
    letter-spacing:.05em;border:1px solid var(--border-strong);border-radius:5px;padding:5px 9px;background:var(--card-soft)}
  .ttag .kit{width:4px;height:14px;border-radius:2px}
  .ttag.both{background:linear-gradient(90deg, rgba(33,158,188,0.15), rgba(251,133,0,0.13));border-color:var(--border-strong)}
  .ttag.hit{border-color:rgba(90,222,140,.5)} .ttag.hit .code{color:var(--good)}
  .ttag.miss{opacity:.45} .ttag.miss .code{text-decoration:line-through}
  .ttag.tok{border-color:rgba(232,185,72,.55)}
  .ttag .tokmark{color:var(--gold);font-size:10px}
  .ttag .pts{color:var(--gold);font-family:'Antonio',sans-serif;font-size:10px}
  .agree{font-family:'Antonio',sans-serif;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-mute);margin:6px 0 0}

  /* bracket tree (mockup 05, live) */
  .bk-toolbar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin:6px 0 14px}
  .bk-toggles{display:flex;gap:12px;flex-wrap:wrap}
  .bk-toggle{display:flex;border:1px solid var(--border-strong);border-radius:6px;overflow:hidden}
  .bk-toggle button{background:transparent;border:none;cursor:pointer;font-family:'Antonio',sans-serif;
    font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-dim);padding:7px 13px;font-weight:500}
  .bk-toggle button+button{border-left:1px solid var(--border)}
  .bk-toggle button.on{background:rgba(255,255,255,.08);color:var(--text)}
  .bk-toggle button.on.m1{background:var(--p1-soft);color:var(--p1)}
  .bk-toggle button.on.m2{background:var(--p2-soft);color:var(--p2)}
  .bk-toggle button.on.mz{background:rgba(255,28,92,.14);color:var(--accent)}
  .bk-legend{display:flex;gap:14px;font-family:'Antonio',sans-serif;font-size:11px;letter-spacing:.06em;
    text-transform:uppercase;color:var(--text-mute);flex-wrap:wrap}
  .bk-legend .sw{width:14px;height:5px;border-radius:2px;display:inline-block;margin-right:6px;vertical-align:middle}
  .bk-legend .sw.a{background:var(--p1)} .bk-legend .sw.c{background:var(--p2)}
  .bk-legend .sw.both{background:linear-gradient(90deg,var(--p1) 50%,var(--p2) 50%)}
  .bk-legend .sw.tok{background:var(--gold)}
  .bk-scroll{overflow-x:auto;overflow-y:hidden;padding-bottom:14px;-webkit-overflow-scrolling:touch}
  .bk-fitbox{position:relative}
  .bk-bracket{position:relative;display:flex;align-items:stretch;height:760px;min-width:1380px}
  #bk-wires{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
  .bk-col{display:flex;flex-direction:column;width:158px;flex:0 0 158px;z-index:1}
  .bk-col.final-col{width:196px;flex:0 0 196px}
  .bk-colhead{font-family:'Antonio',sans-serif;font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--text-mute);text-align:center;padding-bottom:12px;font-weight:500;height:30px}
  .bk-col.final-col .bk-colhead{color:var(--accent)}
  .bk-colbody{flex:1;display:flex;flex-direction:column;justify-content:space-around;padding:0 9px}
  .bk-match{position:relative;background:var(--card);border:1px solid var(--border);border-radius:5px;box-shadow:0 1px 0 rgba(0,0,0,.3)}
  .bk-slot{display:flex;align-items:center;gap:8px;padding:7px 9px;height:29px;position:relative}
  .bk-slot+.bk-slot{border-top:1px solid var(--border)}
  .bk-slot .kit{width:4px;height:18px;border-radius:2px;flex:0 0 4px}
  .bk-slot .code{font-family:'Antonio',sans-serif;font-size:15px;font-weight:600;letter-spacing:.05em;line-height:1;min-width:34px}
  .bk-slot .src{font-family:'Antonio',sans-serif;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--text-mute);margin-left:auto;white-space:nowrap;font-weight:400}
  .bk-slot.pa{background:var(--p1-soft)} .bk-slot.pa .code{color:var(--p1)}
  .bk-slot.pa::before{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--p1)}
  .bk-slot.pc{background:var(--p2-soft)} .bk-slot.pc .code{color:var(--p2)}
  .bk-slot.pc::before{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--p2)}
  .bk-slot.pboth{background:linear-gradient(90deg,rgba(33,158,188,.15),rgba(251,133,0,.13))}
  .bk-slot.pboth .code{color:var(--text)}
  .bk-slot.pboth::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;
    background:linear-gradient(180deg,var(--p1) 50%,var(--p2) 50%)}
  .bk-slot.dim .code{color:var(--text-dim)} .bk-slot.dim .kit{opacity:.5}
  .bk-slot .won{color:var(--good);font-size:11px;margin-left:2px}
  .bk-match.tok{border-color:rgba(232,185,72,.45)}
  .bk-tok{position:absolute;top:-1px;right:-1px;display:flex;align-items:center;gap:5px;background:var(--gold);
    color:#1a1500;font-family:'Antonio',sans-serif;font-size:9px;letter-spacing:.08em;text-transform:uppercase;
    font-weight:700;padding:3px 7px;border-radius:0 4px 0 5px;z-index:3;line-height:1}
  .bk-tok .ow{width:6px;height:6px;border-radius:50%;display:inline-block}
  .bk-tok .ow.a{background:var(--p1)} .bk-tok .ow.c{background:var(--p2)}
  .final-col .bk-colbody{justify-content:center;gap:16px}
  .bk-champ{text-align:center;padding:13px 10px 15px;background:linear-gradient(180deg,rgba(232,185,72,.10),rgba(232,185,72,.02));
    border:1px solid rgba(232,185,72,.35);border-radius:6px}
  .bk-champ .trophy{font-size:22px;line-height:1;color:var(--gold)}
  .bk-champ .lab{font-family:'Antonio',sans-serif;font-size:10px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--gold);margin:7px 0 6px;font-weight:500}
  .bk-champ .team{font-family:'Antonio',sans-serif;font-size:28px;font-weight:700;letter-spacing:.04em;line-height:1}
  .bk-champ .cmp{display:flex;flex-direction:column;gap:9px;margin-top:8px}
  .bk-champ .cmp .rw{display:flex;align-items:center;justify-content:center;gap:8px}
  .bk-champ .cmp .who{font-family:'Antonio',sans-serif;font-size:9px;letter-spacing:.14em;text-transform:uppercase}

  .bk-final{box-shadow:0 0 0 1px rgba(255,28,92,.25),0 6px 24px rgba(0,0,0,.5)}
  .bk-third{margin-top:2px;border:1px dashed var(--border-strong);border-radius:5px;background:var(--card-soft);overflow:hidden}
  .bk-third .tp{font-family:'Antonio',sans-serif;font-size:9px;letter-spacing:.14em;text-transform:uppercase;

  .bk-stack{display:none}
  .bk-stack h3{font-family:'Antonio',sans-serif;font-size:13px;letter-spacing:.14em;text-transform:uppercase;

  .bk-stack .bk-match{margin-bottom:10px}
  .bk-hint{font-family:'Antonio',sans-serif;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--text-mute);text-align:center;margin:0 0 12px}

  .dh{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
  .dhcard{background:linear-gradient(180deg, rgba(232,185,72,0.08), rgba(232,185,72,0.02));
    border:1px solid rgba(232,185,72,.35);border-radius:6px;padding:12px 14px;text-align:center}
  .dhcard .who{font-family:'Antonio',sans-serif;font-size:10px;letter-spacing:.15em;text-transform:uppercase}
  .dhcard.d1 .who{color:var(--p1)} .dhcard.d2 .who{color:var(--p2)}
  .dhcard .tm{font-family:'Antonio',sans-serif;font-size:24px;font-weight:700;letter-spacing:.04em;margin-top:5px}
  .dhcard .lad{font-family:'Antonio',sans-serif;font-size:10px;letter-spacing:.08em;color:var(--gold);margin-top:6px;text-transform:uppercase}

  /* side bets */
  .sgrow{display:grid;grid-template-columns:minmax(150px,1fr) 1fr 1fr minmax(90px,.8fr);gap:10px;align-items:center;
    background:var(--card);border:1px solid var(--border);border-radius:6px;padding:9px 12px;margin-bottom:7px}
  .sgrow .lab{font-family:'Antonio',sans-serif;font-size:12.5px;letter-spacing:.05em;color:var(--text-dim);text-transform:uppercase}
  .sgrow .lab .bp{color:var(--text-mute);font-size:10.5px}
  .sgrow .res{font-size:12.5px;color:var(--gold);text-align:right;font-family:'Antonio',sans-serif;letter-spacing:.04em}
  .sgrow .res.pending{color:var(--text-mute)}
  .sghead{display:grid;grid-template-columns:minmax(150px,1fr) 1fr 1fr minmax(90px,.8fr);gap:10px;padding:4px 12px;
    font-family:'Antonio',sans-serif;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-mute)}
  .note-line{grid-column:1/-1;font-size:12px;color:var(--text-dim);font-style:italic;border-top:1px dashed var(--border);padding-top:6px}

  /* standings */
  .stgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
  table.st{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--border);border-radius:6px;overflow:hidden}
  table.st caption{font-family:'Antonio',sans-serif;font-size:12px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--accent);text-align:left;padding:8px 12px 6px;font-weight:500}
  table.st th{font-family:'Antonio',sans-serif;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--text-mute);font-weight:500;text-align:right;padding:3px 6px;border-bottom:1px solid var(--border)}
  table.st th.tm,table.st td.tm{text-align:left}
  table.st td{font-size:12.5px;padding:5px 6px;text-align:right;border-bottom:1px solid var(--border);font-variant-numeric:tabular-nums}
  table.st tr:last-child td{border-bottom:none}
  table.st td.tm{font-family:'Antonio',sans-serif;font-weight:600;letter-spacing:.04em;font-size:13px}
  table.st td.ptscol{color:var(--gold);font-weight:600}

  @media (max-width:680px){
    .mrow{grid-template-columns:1fr 70px;grid-template-areas:"teams mid" "picks picks"}
    .mrow .mteams{grid-area:teams} .mrow .mid{grid-area:mid} .mrow .mpicks{grid-area:picks;justify-content:flex-start;margin-top:4px}
    .mrow .bline{grid-area:auto;grid-column:1/-1}
    .ladder,.dh{grid-template-columns:1fr}
    .sgrow,.sghead{grid-template-columns:1fr 1fr;}
    .sghead{display:none}
    .sgrow .lab,.sgrow .res{grid-column:1/-1;text-align:left}
    .h2h .score{font-size:30px}
  }
</style>
</head>
<body>

<div class="header">
  <div>
    <div class="title">World Cup <span class="yr">26</span></div>
    <div class="subtitle" id="subtitle">Andreas v Cal · Head-to-head</div>
  </div>
  <div class="h2h" id="h2h"></div>
</div>

<div class="topbar"><div class="tabs" id="tabs">
  <button data-tab="board" class="on">Scoreboard</button>
  <button data-tab="matches">Group matches</button>
  <button data-tab="bracket">Brackets</button>
  <button data-tab="side">Side bets</button>
  <button data-tab="standings">Standings</button>
</div></div>

<div class="wrap">
  <div id="err" class="banner" style="display:none"></div>
  <div id="app"><div class="loading">Loading the pool…</div></div>
  <div class="updated" id="updated"></div>
</div>

<script>
/* ===================== PURE-START (node-testable, no DOM) ===================== */
function outcomeOf(hs, as){ if(hs==null||as==null) return null; return hs>as?"Home":hs<as?"Away":"Draw"; }
function tierOfSlot(slot){
  if(!slot) return null;
  if(slot==="Champion") return "Champion";
  if(slot.indexOf("F-")===0) return "Finalist";
  if(slot.indexOf("SF-")===0) return "SF";
  if(slot.indexOf("QF-")===0) return "QF";
  if(slot.indexOf("R16-")===0) return "R16";
  return null;
}
var TIER_META = [
  ["Champion","Champion","150 pts"],
  ["Finalist","Finalists","40 pts each"],
  ["SF","Semi-finalists","20 pts each"],
  ["QF","Quarter-finalists","10 pts each"],
  ["R16","Round of 16","5 pts each"],
];
function indexData(D){
  var teamById={}; (D.teams||[]).forEach(function(t){ teamById[t.id]=t; });
  var matchById={}; (D.matches||[]).forEach(function(m){ matchById[m.fixture_id]=m; });
  var names=(D.players||[]).map(function(p){return p.name;});
  var picksBy={};
  names.forEach(function(n){ picksBy[n]={}; ((D.picks||{})[n]||[]).forEach(function(p){ picksBy[n][p.key]=p; }); });
  return {teamById:teamById, matchById:matchById, names:names, picksBy:picksBy};
}
function bracketTiers(D){
  var out={};
  Object.keys(D.picks||{}).forEach(function(n){
    (D.picks[n]||[]).forEach(function(p){
      if(p.type!=="bracket_slot") return;
      var t=tierOfSlot(p.bracket_slot); if(!t) return;
      out[t]=out[t]||{}; out[t][n]=out[t][n]||[]; out[t][n].push(p);
    });
  });
  return out;
}
function categoryTotals(D){
  var res={};
  (D.players||[]).forEach(function(pl){
    var c={match:0,bracket:0,side:0,dark:0,bonus:0,rival:0};
    ((D.picks||{})[pl.name]||[]).forEach(function(p){
      var pts=p.points||0;
      if(p.type==="match_outcome"||p.type==="match_exact_score") c.match+=pts;
      else if(p.type==="bracket_slot") c.bracket+=pts;
      else if(p.type==="dark_horse") c.dark+=pts;
      else if(p.type==="side_game") c.side+=pts;
      else if(p.type==="bonus_bet") c.bonus+=pts;
      c.rival+=(p.rival_bonus||0);
    });
    c.total=c.match+c.bracket+c.side+c.dark+c.bonus+c.rival;
    res[pl.name]=c;
  });
  return res;
}
function bonusLabel(p){
  if(p.bet_type==="Over 2.5 goals") return p.bet_value==="Yes"?"Over 2.5":"Under 2.5";
  var short={"BTTS":"BTTS","Penalty in match":"Pen","Red card in match":"Red",
             "Both teams score 2+":"2+ each","Goal in first 15 min":"Goal<15’"}[p.bet_type]||p.bet_type||"?";
  return short+" "+(p.bet_value||"?");
}
function bonusPicksFor(picks, fid){
  return (picks||[]).filter(function(p){ return p.type==="bonus_bet" && p.match_id===fid; });
}
function pickAnswer(p, teamById){
  if(!p) return null;
  if(p.team_id!=null && teamById[p.team_id]) return teamById[p.team_id].code||teamById[p.team_id].name;
  if(p.player_name) return p.player_name;
  if(p.text) return p.text;
  if(p.scalar!=null) return String(p.scalar);
  if(p.outcome) return p.outcome;
  return null;
}
function matchPickState(p, m){
  if(!p||!p.outcome) return {state:null};
  if(!m||m.status!=="Finished") return {state:"pending",exact:false};
  var oc=outcomeOf(m.home_score,m.away_score);
  var hit=p.outcome===oc;
  var exact=hit && p.score_home!=null && p.score_home===m.home_score && p.score_away===m.away_score;
  return {state:hit?"hit":"miss",exact:exact};
}
function matchPickLabel(p, m){
  if(!p||!p.outcome) return null;
  var base=p.outcome==="Draw"?"Draw":(p.outcome==="Home"?(m&&m.home_code||"Home"):(m&&m.away_code||"Away"));
  if(p.score_home!=null&&p.score_away!=null) base+=" "+p.score_home+":"+p.score_away;
  return base;
}
function streakOf(picks, matches){
  // trailing run of correct/incorrect match calls, chronological by kickoff
  var byId={}; (matches||[]).forEach(function(m){ byId[m.fixture_id]=m; });
  var seq=[];
  (picks||[]).filter(function(p){ return p.type==="match_outcome" && p.outcome; })
    .map(function(p){ return {p:p, m:byId[p.match_id]}; })
    .filter(function(x){ return x.m && x.m.status==="Finished"; })
    .sort(function(a,b){ return (a.m.kickoff||"").localeCompare(b.m.kickoff||""); })
    .forEach(function(x){ var st=matchPickState(x.p, x.m);
      if(st.state==="hit"||st.state==="miss") seq.push(st.state); });
  if(!seq.length) return null;
  var last=seq[seq.length-1], n=0;
  for(var i=seq.length-1; i>=0 && seq[i]===last; i--) n++;
  return {hot:last==="hit", n:n};
}
function roundLabel(m){
  var r=String(m.round||"");
  var md=/Group Stage - (\d+)/.exec(r);
  if(md) return "Group "+(m.group||"?")+" · Matchday "+md[1];
  if(r.toLowerCase().indexOf("group")===0) return "Group "+(m.group||"?");
  return r||"Match";
}
/* ---- knockout tree (official FIFA 2026 template, matches 73–104) ---- */
var BR_NUMS={r32:[73,74,75,76,77,78,79,80,81,82,83,84,85,86,87,88],
             r16:[89,90,91,92,93,94,95,96], qf:[97,98,99,100], sf:[101,102], f:[104], "3rd":[103]};
var NEXT_TIER={r32:"R16", r16:"QF", qf:"SF", sf:"Finalist", f:"Champion"};
function koRound(r){
  r=String(r||"").toLowerCase();
  if(!r||r.indexOf("group")===0) return null;
  if(r.indexOf("32")>=0||r.indexOf("1/16")>=0) return "r32";
  if(r.indexOf("quarter")>=0) return "qf";
  if(r.indexOf("semi")>=0) return "sf";
  if(r.indexOf("third")>=0||r.indexOf("3rd")>=0) return "3rd";
  if(r.indexOf("16")>=0||r.indexOf("1/8")>=0||r.indexOf("8th")>=0) return "r16";
  if(r.indexOf("final")>=0) return "f";
  return null;
}
function numRound(no){ for(var r in BR_NUMS){ if(BR_NUMS[r].indexOf(no)>=0) return r; } return null; }
function buildKoIndex(matches, fixToNo){
  // matchNo -> fixture. Explicit map (site/bracket_map_2026.json) wins; otherwise
  // kickoff-order fallback within each round (FIFA numbers matches chronologically).
  var out={}, unmapped={};
  (matches||[]).forEach(function(m){
    var r=koRound(m.round); if(!r) return;
    var no=fixToNo && fixToNo[String(m.fixture_id)];
    if(no) out[no]=m;
    else (unmapped[r]=unmapped[r]||[]).push(m);
  });
  Object.keys(unmapped).forEach(function(r){
    var nums=(BR_NUMS[r]||[]).slice().sort(function(a,b){return a-b;})
      .filter(function(n){return !out[n];});
    unmapped[r].sort(function(a,b){return (a.kickoff||"").localeCompare(b.kickoff||"");})
      .forEach(function(m,i){ if(nums[i]!=null) out[nums[i]]=m; });
  });
  return out;
}
function ladderSets(D){
  // player -> tier -> {team_id: pick} from bracket_slot picks (locked players only — the
  // API already withholds unlocked players' picks).
  var out={};
  Object.keys(D.picks||{}).forEach(function(n){
    out[n]={};
    (D.picks[n]||[]).forEach(function(p){
      if(p.type!=="bracket_slot"||p.team_id==null) return;
      var t=tierOfSlot(p.bracket_slot); if(!t) return;
      (out[n][t]=out[n][t]||{})[p.team_id]=p;
    });
  });
  return out;
}
/* ====================== PURE-END ====================== */

var D=null, IDX=null, ACTIVE="board", LAST_FETCH=0;
var $=function(s){return document.querySelector(s);};
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function P1(){ return D.players[0]||{}; } function P2(){ return D.players[1]||{}; }
function cls(name){ return name===P1().name?"1":"2"; }

function fmtKick(iso){
  if(!iso) return "TBD";
  var d=new Date(iso);
  return d.toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"})+" · "+
         d.toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit"});
}
function tokmark(tok){
  if(!tok) return "";
  var m={Double:"×2",Triple:"×3",AllIn:"×5"}[tok]||tok;
  return '<span class="tokmark">'+m+'</span>';
}

function header(){
  var h="";
  [P1(),P2()].forEach(function(p,i){
    var t=p.tokens||{};
    var toks=(t.Double!=null)?(t.Double+"D · "+t.Triple+"T · "+t.AllIn+"A"):"";
    var stk=streakOf((D.picks||{})[p.name], D.matches);
    h+='<div class="col c'+(i+1)+'"><div class="name">'+esc(p.name)+'</div>'+
       '<div class="score">'+(p.total_score||0)+'</div>'+
       (toks?'<div class="meta">'+toks+' left</div>':'')+
       '<div class="lockst '+(p.locked?'yes':'no')+'">'+(p.locked?'🔒 locked':'not locked')+'</div>'+
       (stk?'<div class="streak '+(stk.hot?"hot":"cold")+'">'+(stk.hot?("▲ "+stk.n+" right"):("▼ "+stk.n+" wrong"))+'</div>':'')+
       '</div>';
  });
  $("#h2h").innerHTML=h;
  if(P1().name&&P2().name) $("#subtitle").textContent=P1().name+" v "+P2().name+" · Head-to-head";
  document.documentElement.style.setProperty("--p1", P1().color||"#219ebc");
  document.documentElement.style.setProperty("--p2", P2().color||"#fb8500");
}

/* ---- match cards (mockup 04, live) ---- */
function countdown(iso){
  if(!iso) return "Schedule TBD";
  var ms=new Date(iso)-new Date();
  if(ms<=0) return "Kicking off";
  var d=Math.floor(ms/86400000), hh=Math.floor(ms%86400000/3600000), mn=Math.floor(ms%3600000/60000);
  return "Kicks off in "+(d>0?(d+"d "+hh+"h"):(hh>0?(hh+"h "+mn+"m"):(mn+"m")));
}
function tokenName(t){ return t==="AllIn"?"All-In ×5":t==="Triple"?"Triple ×3":t==="Double"?"Double ×2":t; }
function pickCell(pl, m, idx){
  var c="pick c"+idx+(idx===1?" first":"");
  var head='<div class="pick-head"><span class="pick-name">'+esc(pl.name)+'</span>';
  if(!pl.locked) return '<div class="'+c+'">'+head+'</div><div class="nopick">Hidden until lock</div></div>';
  var p=(IDX.picksBy[pl.name]||{})["match|"+m.fixture_id];
  if(!p||!p.outcome) return '<div class="'+c+'">'+head+'</div><div class="nopick">No pick</div></div>';
  var st=matchPickState(p,m), fin=m.status==="Finished";
  if(fin && p.resolved){
    var tot=(p.points||0)+(p.rival_bonus||0);
    head+='<span class="pick-pts'+(tot?"":" zero")+'">'+(tot?("+"+tot):"0")+'</span>';
  }
  head+='</div>';
  var beat=(p.rival_bonus||0)>0
    ? '<div class="beat-flag">Beat '+esc((pl.name===P1().name?P2():P1()).name||"rival")+' +'+p.rival_bonus+'</div>' : "";
  var predTeam=p.outcome==="Draw"?"DRAW":(p.outcome==="Home"?(m.home_code||"HOME"):(m.away_code||"AWAY"));
  var big=(p.score_home!=null&&p.score_away!=null)
    ? p.score_home+" – "+p.score_away+' <span class="pred-team">'+esc(predTeam)+'</span>'
    : '<span style="font-family:Antonio,sans-serif;font-size:19px;letter-spacing:.05em">'+esc(predTeam)+'</span>';
  var ocTxt = p.outcome==="Draw" ? "Draw"
    : esc((p.outcome==="Home"?(m.home_name||m.home_code||"Home"):(m.away_name||m.away_code||"Away")))+" to win";
  var ocCls="";
  if(fin && st.state==="hit"){ ocCls=" correct"; ocTxt = st.exact ? "Outcome &amp; exact ✓" : "Outcome ✓"; }
  else if(fin && st.state==="miss"){ ocCls=" wrong"; ocTxt="Wrong outcome"; }
  var tok = p.token
    ? '<div class="tokchip'+(fin&&p.resolved?" spent":"")+'">◆ '+esc(tokenName(p.token))+(fin&&p.resolved?" — used":"")+'</div>'
    : '<div class="tok-none">No token</div>';
  var note="";
  if(p.note) note='<div class="pnote">“'+esc(p.note)+'”</div>';
  else if(p.has_note) note='<div class="pnote sealed">Pundit note sealed'+(m.status==="Live"?" until full time":"")+'</div>';
  return '<div class="'+c+'">'+beat+head+
    '<div class="pick-score">'+big+'</div>'+
    '<div class="pick-outcome'+ocCls+'">'+ocTxt+'</div>'+tok+note+'</div>';
}
function bonusStrip(m){
  var startedM = (m.status && m.status!=="Scheduled") || (m.kickoff && new Date(m.kickoff)<=new Date());
  var fin=m.status==="Finished";
  if(!startedM){
    return '<div class="bstrip"><span class="blabel">Bonus bets — revealed at kickoff</span><div class="bstate">'+
      [P1(),P2()].map(function(pl){ return '<span class="person"><span class="dot"></span>'+esc(pl.name)+'</span>'; }).join("")+
      '</div></div>';
  }
  var bA=bonusPicksFor(D.picks[P1().name], m.fixture_id);
  var bC=bonusPicksFor(D.picks[P2().name], m.fixture_id);
  if(!bA.length && !bC.length) return "";
  var voided = fin && (!bA.length || !bC.length);
  var label = fin ? (voided?"Bonus bets — void (one-sided)":"Bonus bets — resolved") : "Bonus bets — revealed";
  var h='<div class="bstrip"><span class="blabel">'+label+'</span><div class="bstate">';
  [[P1(),bA,1],[P2(),bC,2]].forEach(function(t){
    var pl=t[0], bets=t[1], i=t[2];
    if(!bets.length){ h+='<span class="person"><span class="dot"></span>'+esc(pl.name)+' · No bet</span>'; return; }
    var parts=bets.map(function(p){
      var mark="";
      if(fin && p.resolved){
        mark = voided ? ' <span class="voidm">void</span>'
             : (p.points>0 ? ' <span class="hitm">✓ +'+(p.points+(p.rival_bonus||0))+'</span>' : ' <span class="missm">✗</span>');
      }
      return esc(bonusLabel(p))+(p.token?" ◆":"")+mark;
    });
    h+='<span class="person in w'+i+'"><span class="dot"></span>'+esc(pl.name)+' · '+parts.join(" · ")+'</span>';
  });
  return h+'</div></div>';
}
function matchCard(m){
  var live=m.status==="Live", fin=m.status==="Finished";
  var pill = live ? '<span class="pill live">Live</span>'
    : fin ? '<span class="pill final">Final</span>'
    : (P1().locked&&P2().locked) ? '<span class="pill locked">Locked</span>'
    : '<span class="pill open">Open</span>';
  var stage = live ? "In progress"
    : fin ? (m.winner_method==="Penalties"?"Penalties":m.winner_method==="Extra Time"?"After extra time":"After 90 min")
    : countdown(m.kickoff);
  var t1=IDX.teamById[m.home_id]||{}, t2=IDX.teamById[m.away_id]||{};
  var sc=(fin||live)?((m.home_score!=null?m.home_score:"–")+" : "+(m.away_score!=null?m.away_score:"–")):"— : —";
  var under = live ? (m.elapsed!=null?m.elapsed+"’":"Live")
    : fin ? "Full time" : "Awaiting kickoff";
  return '<div class="mcard'+(live?" is-live":"")+'">'+
    '<div class="mc-meta"><span class="grp">'+esc(roundLabel(m))+'</span>'+pill+'</div>'+
    '<div class="mc-meta" style="padding-top:0"><span class="venue">'+esc(fmtKick(m.kickoff)+(m.venue?(" · "+m.venue):""))+'</span>'+
      '<span class="stage">'+esc(stage)+'</span></div>'+
    '<div class="matchup">'+
      '<div class="team home"><div class="kitbar" style="background:'+(t1.kit||"#444")+'"></div>'+
        '<div class="tcode">'+esc(m.home_code||"?")+'</div><div class="tname">'+esc(m.home_name||"")+'</div></div>'+

function bkLine(svg,x1,y1,x2,y2){
  var ns="http://www.w3.org/2000/svg", l=document.createElementNS(ns,"line");
  l.setAttribute("x1",x1); l.setAttribute("y1",y1); l.setAttribute("x2",x2); l.setAttribute("y2",y2);
  l.setAttribute("stroke","rgba(255,255,255,0.18)"); l.setAttribute("stroke-width","1.5");
  l.setAttribute("shape-rendering","crispEdges"); svg.appendChild(l);

function bkWires(){
  var bracket=document.getElementById("bk-bracket"), svg=document.getElementById("bk-wires");
  if(!bracket||!svg) return;
  var cont=bracket.getBoundingClientRect();
  svg.setAttribute("viewBox","0 0 "+bracket.offsetWidth+" "+bracket.offsetHeight);
  while(svg.firstChild) svg.removeChild(svg.firstChild);
  var elbow=function(child,parent,leftSide){
    var c=bkRect(child,cont), p=bkRect(parent,cont); if(!c||!p) return;
    if(leftSide){ var x=(c.right+p.left)/2;
      bkLine(svg,c.right,c.cy,x,c.cy); bkLine(svg,x,c.cy,x,p.cy); bkLine(svg,x,p.cy,p.left,p.cy);
    } else { var x2=(p.right+c.left)/2;
      bkLine(svg,c.left,c.cy,x2,c.cy); bkLine(svg,x2,c.cy,x2,p.cy); bkLine(svg,x2,p.cy,p.right,p.cy); }
  };
  Object.keys(BR_FEED_L).forEach(function(p){ BR_FEED_L[p].forEach(function(k){ elbow(k,p,true); }); });
  Object.keys(BR_FEED_R).forEach(function(p){ BR_FEED_R[p].forEach(function(k){ elbow(k,p,false); }); });
  var fr=bkRect(104,cont), l=bkRect(101,cont), r=bkRect(102,cont);
  if(fr&&l&&r){
    var lx=(l.right+fr.left)/2, rx=(fr.right+r.left)/2;
    bkLine(svg,l.right,l.cy,lx,l.cy); bkLine(svg,lx,l.cy,lx,fr.cy); bkLine(svg,lx,fr.cy,fr.left,fr.cy);
    bkLine(svg,r.left,r.cy,rx,r.cy); bkLine(svg,rx,r.cy,rx,fr.cy); bkLine(svg,rx,fr.cy,fr.right,fr.cy);
  }
}
function bkLayout(){
  var scroll=document.getElementById("bk-scroll"), fitbox=document.getElementById("bk-fitbox"),

  if(hint) hint.style.display=(!narrow&&BRK_ZOOM==="full")?"block":"none";
  if(narrow) return;
  bracket.style.transform="none"; fitbox.style.width=""; fitbox.style.height="";

  if(BRK_ZOOM==="fit"){

    fitbox.style.width=(nW*s)+"px"; fitbox.style.height=(nH*s)+"px";
    scroll.style.overflowX="hidden";
  } else { scroll.style.overflowX="auto"; }
}

         '<td>'+(s.gd!=null?s.gd:0)+'</td><td class="ptscol">'+(s.points!=null?s.points:0)+'</td></tr>';
    });
    h+='</table>';
  });
  return h+'</div>';
}

function render(){
  header();
  var fn={board:boardTab, matches:matchesTab, bracket:bracketTab, side:sideTab, standings:standingsTab}[ACTIVE];
  $("#app").innerHTML='<div class="tabpanel active">'+fn()+'</div>';
  if(ACTIVE==="bracket"){
    var hasKO=(D.matches||[]).some(function(m){return koRound(m.round);});
    if((BRK_VIEW||(hasKO?"tree":"ladder"))==="tree") bkMount();
  }
  var d=new Date(LAST_FETCH);
  $("#updated").textContent="updated "+d.toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit",second:"2-digit"});
}

function setTab(name){
  ACTIVE=name;
  document.querySelectorAll("#tabs button").forEach(function(b){ b.classList.toggle("on", b.dataset.tab===name); });
  if(D) render();
}
document.addEventListener("click",function(e){
  var b=e.target.closest&&e.target.closest("#tabs button");
  if(b) setTab(b.dataset.tab);
  var bk=e.target.closest&&e.target.closest("[data-bkview],[data-bkmode],[data-bkzoom]");
  if(bk){
    if(bk.dataset.bkview) BRK_VIEW=bk.dataset.bkview;
    if(bk.dataset.bkmode) BRK_MODE=bk.dataset.bkmode;
    if(bk.dataset.bkzoom){ BRK_ZOOM=bk.dataset.bkzoom; bkLayout();
      document.querySelectorAll("[data-bkzoom]").forEach(function(x){x.classList.toggle("on",x.dataset.bkzoom===BRK_ZOOM);x.classList.toggle("mz",x.dataset.bkzoom===BRK_ZOOM);});
      return; }
    render();
  }
});
window.addEventListener("resize",function(){ if(ACTIVE==="bracket") bkLayout(); });

async function refresh(){
  try{
    var demo=new URLSearchParams(location.search).get("demo");
    if(demo){ D=demoData(); BRK_MAP={"200":101,"201":102,"202":104}; }
    else{
      if(BRK_MAP===null){
        // fixture_id -> FIFA match number (73-104); filled at draw time, fallback = kickoff order
        try{ var mres=await fetch("bracket_map_2026.json");
             BRK_MAP=mres.ok?(((await mres.json())||{}).fixture_to_match||{}):{};
        }catch(e){ BRK_MAP={}; }
      }
      var res=await fetch("/api/public");
      var j=await res.json();
      if(!res.ok) throw new Error(j.error||"load failed");
      D=j;
    }
    IDX=indexData(D);
    LAST_FETCH=Date.now();
    $("#err").style.display="none";
    render();
  }catch(err){
    $("#err").textContent="⚠ Couldn’t refresh: "+err.message;
    $("#err").style.display="block";
    if(!D) $("#app").innerHTML="";
  }
}
refresh();
setInterval(refresh, 90000);
document.addEventListener("visibilitychange",function(){
  if(document.visibilityState==="visible" && Date.now()-LAST_FETCH>30000) refresh();
});
